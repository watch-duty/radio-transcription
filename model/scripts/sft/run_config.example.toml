# This file is the canonical committed placeholder config. Copy it outside the
# repo for real runs, replace every placeholder, and do not commit local
# experiment configs.
#
# `round_id` becomes gs://<bucket>/sft/runs/<round_id>/ and must be unique for
# a new experiment.
round_id = "YYYY-MM-DD-short-description"

# `inference_dataset_slug` identifies the evaluated corpus/split used for
# normalized inference-manifest output placement, for example:
# gs://<bucket>/inference_manifests/echo/eval/<model>/<round_id>/base.jsonl
inference_dataset_slug = "echo/eval"

# These are canonical manifests. `prepare` derives Gemini SFT JSONL for train
# and validation, while eval stays held out for `gemini-sft eval`.
train_manifest_uri = "gs://your-bucket/path/manifests/canonical/train.jsonl"
validation_manifest_uri = "gs://your-bucket/path/manifests/canonical/validation.jsonl"
eval_manifest_uri = "gs://your-bucket/path/manifests/canonical/eval.jsonl"

[gcp]
project = "your-gcp-project"
# Bucket name only, not a gs:// URI. Generated run artifacts go under
# gs://<bucket>/sft/runs/<round_id>/.
bucket = "your-gcs-bucket"
location = "us-central1"

[sft]
base_model = "gemini-3.1-flash-lite"
epoch_count = 6
adapter_size = "SIXTEEN"
learning_rate_multiplier = 1.0

[eval.model]
# `gemini-sft eval` supports one model per config. To compare base, tuned, or
# checkpoint models, run separate config files in parallel with an external
# wrapper.
label = "base"
model = "gemini-3.1-flash-lite"

# For a checkpoint or tuned endpoint, use the same table shape:
# label = "checkpoint_6"
# model = "projects/PROJECT/locations/us-central1/endpoints/ENDPOINT_ID"
#
# Masked and unmasked evals should use separate config files with distinct
# round_id, eval_manifest_uri, and inference_dataset_slug values.

# Optional eval execution controls. Omit `backend` for default routing:
# publisher/model IDs use batch inference, full endpoint resources use online
# generate-content. To compare forced backends, use separate config files/runs.
[eval.execution]
# backend = "online"
# limit = 100
concurrency = 16
max_retries = 3

[prompts]
# Optional inline overrides only. Prompt files are intentionally unsupported so
# the resolved prompt text can be stored in config.json for resume/eval.
# system = "..."
# user = "..."
