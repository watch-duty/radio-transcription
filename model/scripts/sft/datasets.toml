# Gemini SFT dataset registry — read by pipeline.py via tomllib (stdlib, Python 3.11+).
# Each [datasets.<name>] section maps a dataset to its adapter and source location.
# pipeline.py build always writes per-dataset JSONLs plus one combined JSONL for the
# exact --datasets set passed. The combined JSONL name is derived at runtime.
#
# Echo-only: the pipeline fine-tunes on Watch Duty's proprietary emergency-radio data.
# The earlier HuggingFace ATC augmentation datasets (atcosim / uwb_atcc / atco2) and the
# hf_dataset adapter were removed — only the gcs_manifest adapter is supported.

[datasets.echo]
# gcs_manifest adapter: reads a pre-split GCS JSONL manifest directly (no audio re-encode).
adapter = "gcs_manifest"
# NOTE: train_manifest_uri is a placeholder. The cluster-split script must run before
# this URI is valid.
train_manifest_uri = ""
# Replace with the real eval manifest URI from gs://wd-transcription-data/inference_manifests/
eval_manifest_uri = "gs://wd-transcription-data/inference_manifests/echo/eval/gemini_transcribe_05_2026/results/results.jsonl"
# Optional validation split for tuning-time eval_total_loss. Leave empty to tune without
# a validation dataset; like train_manifest_uri, the cluster-split script produces it.
# When set, `build` emits combined_val_uri and `tune` wires it to Vertex.
val_manifest_uri = ""
normalize = false
license = "proprietary"
