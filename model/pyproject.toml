[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radio-transcription-model"
version = "0.1.0"
description = "Shared transcription library for the radio-transcription model subtree."
requires-python = ">=3.11"
dependencies = [
    # Core stays light: `import common.prompts` must NOT pull NeMo / torch / datasets.
    # google-cloud-storage is used by gcs_utils everywhere — it is genuinely core.
    "google-cloud-storage>=2.19",
]

[project.optional-dependencies]
# audio behind its own extra — torchaudio is heavy and not every path needs it.
audio = ["torchaudio>=2.5", "soundfile>=0.13,<0.14"]
# pinned per research.
scoring = ["jiwer>=3.1,<4", "nemo_text_processing==1.1.0"]
hf = [
    "torchaudio>=2.5",
    "soundfile>=0.13,<0.14",
    "datasets>=4.0,<5",
    "huggingface_hub>=0.30",
    "evaluate>=0.4",
]
vertex = ["google-genai>=2.10,<3", "google-cloud-aiplatform>=1.158.0"]
dev = ["pytest>=9.0,<10", "pytest-xdist>=3"]
# A convenience bundle of every runtime extra.
all = [
    "torchaudio>=2.5",
    "jiwer>=3.1,<4",
    "nemo_text_processing==1.1.0",
    "datasets>=4.0,<5",
    "soundfile>=0.13,<0.14",
    "huggingface_hub>=0.30",
    "evaluate>=0.4",
    "google-genai>=2.10,<3",
    "google-cloud-aiplatform>=1.158.0",
]

[project.scripts]
gemini-sft = "gemini_sft.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["common*", "gemini_sft*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
