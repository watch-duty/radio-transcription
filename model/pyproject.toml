[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "common"
version = "0.1.0"
description = "Shared transcription/SFT library for the radio-transcription model subtree."
requires-python = ">=3.13,<3.14"
dependencies = [
    # Core stays light: `import common.prompts` must NOT pull NeMo / torch / datasets.
    # google-cloud-storage is used by gcs_utils everywhere — it is genuinely core.
    "google-cloud-storage>=2.19",
]

[project.optional-dependencies]
# D-01: audio behind its own extra — torchaudio is heavy and not every path needs it.
audio = ["torchaudio>=2.5"]
# PKG-03 / D-02: pinned per research.
scoring = ["jiwer>=3.1,<4", "nemo_text_processing==1.1.0"]
hf = ["datasets>=4.0,<5", "soundfile>=0.13,<0.14", "huggingface_hub>=0.30"]
vertex = ["google-genai>=2.3,<3"]
dev = ["pytest>=9.0,<10"]
# Claude's Discretion (D-03 note): a convenience bundle of every runtime extra.
all = [
    "torchaudio>=2.5",
    "jiwer>=3.1,<4",
    "nemo_text_processing==1.1.0",
    "datasets>=4.0,<5",
    "soundfile>=0.13,<0.14",
    "huggingface_hub>=0.30",
    "google-genai>=2.3,<3",
]

[tool.setuptools]
# PITFALLS.md Pitfall 9 / ARCHITECTURE.md Risk 1: a SINGLE top-level mapping only.
# Per-subpackage package-dir entries are the documented broken case for editable installs.
package-dir = { common = "colabs/common" }

[tool.setuptools.packages.find]
where = ["colabs"]
include = ["common*"]
