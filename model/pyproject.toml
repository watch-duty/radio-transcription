[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "common"
version = "0.1.0"
description = "Shared transcription library for the radio-transcription model subtree."
requires-python = ">=3.10"
dependencies = [
    # Core stays light: `import common.prompts` must NOT pull NeMo / torch / datasets.
    # google-cloud-storage is used by gcs_utils everywhere — it is genuinely core.
    "google-cloud-storage>=2.19",
]

[project.optional-dependencies]
# audio behind its own extra — torchaudio is heavy and not every path needs it.
audio = ["torchaudio>=2.5", "soundfile>=0.13,<0.14"]
# pinned per research.
scoring = ["jiwer>=3.1,<4", "nemo_text_processing==1.1.0"]
hf = ["common[audio]", "datasets>=4.0,<5", "huggingface_hub>=0.30", "evaluate>=0.4"]
vertex = ["google-genai>=2.3,<3"]
adk = ["google-adk>=2.1,<3"]
dev = ["pytest>=9.0,<10", "pytest-xdist>=3"]
# A convenience bundle of every runtime extra.
all = [
    "torchaudio>=2.5",
    "jiwer>=3.1,<4",
    "nemo_text_processing==1.1.0",
    "datasets>=4.0,<5",
    "soundfile>=0.13,<0.14",
    "huggingface_hub>=0.30",
    "evaluate>=0.4",
    "google-genai>=2.3,<3",
]

[tool.setuptools]
# Use a SINGLE top-level package-dir mapping only.
# Per-subpackage package-dir entries are the documented broken case for editable installs.
package-dir = { common = "colabs/common" }

[tool.setuptools.packages.find]
where = ["colabs"]
include = ["common*"]
exclude = ["common.tests*"]

[tool.pytest.ini_options]
# model/ tests live under colabs/common/tests/. testpaths keeps `pytest` run from
# model/ from collecting the backend suite.
testpaths = ["colabs/common/tests"]

[tool.uv]
conflicts = [
    [
        { extra = "adk" },
        { extra = "vertex" },
    ],
    [
        { extra = "adk" },
        { extra = "all" },
    ],
]
