version: '3.8'
services:
  # ------------- Storage -------------
  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/cloud-sdk:emulators
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085
    ports:
      - "8085:8085"
    networks:
      - pipeline-network

  pubsub-init:
    image: python:3.13-slim
    depends_on:
      - pubsub-emulator
      - rules-evaluation
      - rules-management
      - notification
    env_file:
      - ./local_dev/LOCAL.env
    networks:
      - pipeline-network
    volumes:
      - ./local_dev/pubsub_init.py:/app/pubsub_init.py
    working_dir: /app
    command: sh -c "pip install requests && python pubsub_init.py"

  gcs-init:
    image: python:3.13-slim
    depends_on:
      - gcs-emulator
    env_file:
      - ./local_dev/LOCAL.env
    networks:
      - pipeline-network
    volumes:
      - ./local_dev/gcs_init.py:/app/gcs_init.py
      - ./local_dev/data:/app/data
    working_dir: /app
    command: sh -c "pip install requests && python gcs_init.py"

  gcs-emulator:
    image: fsouza/fake-gcs-server
    ports:
      - "4443:4443"
    command: -scheme http -external-url http://gcs-emulator:4443
    networks:
      - pipeline-network

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      # Mount migrations read-only at /sql and use an init script that skips
      # pg_cron files (extension is production-only via AlloyDB flag; the
      # postgres:15-alpine image doesn't ship it). See the script for details.
      - ./terraform/modules/alloydb/sql/ingestion:/sql:ro
      - ./local_dev/docker_postgres_init.sh:/docker-entrypoint-initdb.d/00_apply_schema.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pipeline-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - pipeline-network
  
  # ----------- Pipeline Services ----------
  transcription-continuous:
    build:
      context: .
      dockerfile: backend/pipeline/transcription/Dockerfile
    entrypoint: ["python3", "backend/pipeline/transcription/main.py"]
    # DirectRunner doesn't support deduplication, so we need to give an empty field here to disable it.
    command: >
      --input_subscription projects/$GOOGLE_CLOUD_PROJECT/subscriptions/$CONTINUOUS_AUDIO_SUBSCRIPTION
      --output_topic $TRANSCRIPTION_TOPIC
      --project $GOOGLE_CLOUD_PROJECT
      --id_label "" 
      --canonical_audio_bucket $AUDIO_CANONICAL_BUCKET
    env_file:
      - ./local_dev/LOCAL.env
    networks:
      - pipeline-network
    depends_on:
      - pubsub-emulator
      - pubsub-init
      - gcs-emulator
      - gcs-init

  transcription-segmented:
    build:
      context: .
      dockerfile: backend/pipeline/transcription/Dockerfile
    entrypoint: ["python3", "backend/pipeline/transcription/main.py"]
    # DirectRunner doesn't support deduplication, so we need to give an empty field here to disable it.
    command: >
      --input_subscription projects/$GOOGLE_CLOUD_PROJECT/subscriptions/$SEGMENTED_AUDIO_SUBSCRIPTION
      --output_topic $TRANSCRIPTION_TOPIC
      --project $GOOGLE_CLOUD_PROJECT
      --bypass_stitching true
      --id_label ""
      --canonical_audio_bucket $AUDIO_CANONICAL_BUCKET
    env_file:
      - ./local_dev/LOCAL.env
    networks:
      - pipeline-network
    depends_on:
      - pubsub-emulator
      - pubsub-init
      - gcs-emulator
      - gcs-init

  rules-evaluation:
    build:
      context: .
      dockerfile: backend/pipeline/evaluation/Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - ./local_dev/LOCAL.env
    volumes:
      - ./local_dev/run_evaluation_publish.py:/app/run_evaluation_publish.py
    command: ["functions-framework", "--source=backend/pipeline/evaluation/main.py", "--target=evaluate_transcribed_audio_segment", "--signature-type=cloudevent", "--port=8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s = socket.socket(); s.connect(('localhost', 8080))"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pipeline-network
    depends_on:
      - pubsub-emulator
      - rules-management
      - transcripts-api
      - postgres

  notification:
    build:
      context: .
      dockerfile: backend/pipeline/notification/Dockerfile
    ports:
      - "8081:8081"
    env_file:
      - ./local_dev/LOCAL.env
    environment:
      - REDIS_HOST=redis
    command: ["functions-framework", "--source=backend/pipeline/notification/send_notification.py", "--target=send_notification", "--signature-type=cloudevent", "--port=8081"]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s = socket.socket(); s.connect(('localhost', 8081))"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pipeline-network
    depends_on:
      - pubsub-emulator
      - redis

  # ----------- API Management Services ----------
  rules-management:
    build:
      context: .
      dockerfile: backend/services/rules/Dockerfile
    ports:
      - "8086:8086"
    env_file:
      - ./local_dev/LOCAL.env
    command: ["uvicorn", "backend.services.rules.main:app", "--host", "0.0.0.0", "--port", "8086"]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s = socket.socket(); s.connect(('localhost', 8086))"]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pipeline-network

  transcripts-api:
    build:
      context: .
      dockerfile: backend/services/transcripts/Dockerfile
    ports:
      - "8087:8087"
    env_file:
      - ./local_dev/LOCAL.env
    command: ["uvicorn", "backend.services.transcripts.main:app", "--host", "0.0.0.0", "--port", "8087"]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s = socket.socket(); s.connect(('localhost', 8087))"]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pipeline-network

  feeds-api:
    build:
      context: .
      dockerfile: backend/services/feeds/Dockerfile
    ports:
      - "8089:8089"
    env_file:
      - ./local_dev/LOCAL.env
    command: ["uvicorn", "backend.services.feeds.main:app", "--host", "0.0.0.0", "--port", "8089"]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s = socket.socket(); s.connect(('localhost', 8089))"]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pipeline-network

  mock-server:
    image: python:3.13-slim
    ports:
      - "8082:8082"
    volumes:
      - ./local_dev/mock_server.py:/app/mock_server.py
    working_dir: /app
    command: python -u mock_server.py
    networks:
      - pipeline-network

  frontend-api:
    build:
      context: .
      dockerfile: frontend/api/Dockerfile
    ports:
      - "8088:8080"
    env_file:
      - ./local_dev/LOCAL.env
    environment:
      - TRANSCRIPTS_API_URL=http://transcripts-api:8087/v1/transcripts
    networks:
      - pipeline-network
    depends_on:
      - transcripts-api
      - rules-management

  # ----------- Integration Tests ----------
  integration-tests:
    image: python:3.13-slim
    depends_on:
      postgres:
        condition: service_healthy
      transcripts-api:
        condition: service_healthy
      rules-management:
        condition: service_healthy
      feeds-api:
        condition: service_healthy
      rules-evaluation:
        condition: service_healthy
      notification:
        condition: service_healthy
      pubsub-emulator:
        condition: service_started
      redis:
        condition: service_started
      mock-server:
        condition: service_started
      pubsub-init:
        condition: service_completed_successfully
      gcs-init:
        condition: service_completed_successfully
      gcs-emulator:
        condition: service_started
      transcription-continuous:
        condition: service_started
      transcription-segmented:
        condition: service_started
    env_file:
      - ./local_dev/LOCAL.env
    environment:
      - UV_PROJECT_ENVIRONMENT=/tmp/.venv
    volumes:
      - .:/app
    working_dir: /app
    command: >
      sh -c "pip install uv && uv sync &&
      uv run python -m grpc_tools.protoc -I=protos --python_out=backend/pipeline/schema_types protos/*.proto &&
      uv run pytest integration_tests/* -v -s --log-cli-level=INFO"
    networks:
      - pipeline-network

networks:
  pipeline-network:
