openapi: 3.0.0
components:
  examples: {}
  headers: {}
  parameters: {}
  requestBodies: {}
  responses: {}
  schemas:
    Transcript:
      properties:
        feedId:
          type: string
        transmissionId:
          type: string
        transcript:
          type: string
        startTimestamp:
          type: string
        endTimestamp:
          type: string
        missingPriorContext:
          type: boolean
        missingPostContext:
          type: boolean
        sourceAudioUris:
          items:
            type: string
          type: array
        canonicalAudioUri:
          type: string
        startAudioOffset:
          type: string
        endAudioOffset:
          type: string
        evaluationDecisions:
          items:
            type: string
          type: array
      required:
        - feedId
        - transmissionId
        - transcript
        - startTimestamp
        - endTimestamp
        - missingPriorContext
        - missingPostContext
        - sourceAudioUris
        - canonicalAudioUri
        - startAudioOffset
        - endAudioOffset
        - evaluationDecisions
      type: object
      additionalProperties: false
    ListTranscriptsResponse:
      properties:
        transcripts:
          items:
            $ref: "#/components/schemas/Transcript"
          type: array
      required:
        - transcripts
      type: object
      additionalProperties: false
  securitySchemes:
    google_id_token:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: ""
          scopes: {}
      x-google-auth:
        issuer: https://accounts.google.com
        jwksUri: https://www.googleapis.com/oauth2/v3/certs
        audiences:
          - ${google_auth_client_id}
info:
  title: radio-transcription-api
  version: 1.0.0
  contact: {}
paths:
  /api/v1/transcripts/{feedId}:
    get:
      operationId: ListTranscripts
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListTranscriptsResponse"
        "401":
          description: Unauthorized
        "404":
          description: ""
          content:
            application/json:
              schema:
                properties:
                  message:
                    type: string
                required:
                  - message
                type: object
      tags:
        - Transcripts
      security:
        - google_id_token: []
      parameters:
        - in: path
          name: feedId
          required: true
          schema:
            type: string
      x-google-backend: radio-transcription-api
servers:
  - url: /
x-google-api-management:
  backends:
    radio-transcription-api:
      address: ${radio_transcription_api_url}
      path_translation: APPEND_PATH_TO_ADDRESS
      protocol: http/1.1
