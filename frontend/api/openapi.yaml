openapi: 3.0.0
components:
  examples: {}
  headers: {}
  parameters: {}
  requestBodies: {}
  responses: {}
  schemas:
    Transcript:
      properties:
        feedId:
          type: string
        segmentId:
          type: string
        transcript:
          type: string
        startTimestamp:
          type: string
        endTimestamp:
          type: string
        missingPriorContext:
          type: boolean
        missingPostContext:
          type: boolean
        sourceAudioUris:
          items:
            type: string
          type: array
        canonicalAudioUri:
          type: string
        playbackAudioUri:
          type: string
        startAudioOffset:
          type: string
        endAudioOffset:
          type: string
        evaluationDecisions:
          items:
            type: string
          type: array
      required:
        - feedId
        - segmentId
        - transcript
        - startTimestamp
        - endTimestamp
        - missingPriorContext
        - missingPostContext
        - sourceAudioUris
        - canonicalAudioUri
        - playbackAudioUri
        - startAudioOffset
        - endAudioOffset
        - evaluationDecisions
      type: object
      additionalProperties: false
    ListTranscriptsResponse:
      properties:
        transcripts:
          items:
            $ref: "#/components/schemas/Transcript"
          type: array
        nextToken:
          type: string
      required:
        - transcripts
      type: object
      additionalProperties: false
    ListTranscriptsQueryParams:
      properties:
        limit:
          type: integer
          format: int32
          default: 100
        nextToken:
          type: string
        startTime:
          type: string
        endTime:
          type: string
        order:
          type: string
          enum:
            - asc
            - desc
        isAlert:
          type: boolean
      type: object
      additionalProperties: false
    ScopeLevel:
      type: string
      enum:
        - FEED_SPECIFIC
        - GLOBAL
    Scope:
      properties:
        level:
          $ref: "#/components/schemas/ScopeLevel"
        targetFeeds:
          items:
            type: string
          type: array
      required:
        - level
        - targetFeeds
      type: object
      additionalProperties: false
    LogicalOperator:
      type: string
      enum:
        - ANY
        - ALL
    KeywordConditions:
      properties:
        evaluationType:
          type: string
          enum:
            - KEYWORD_MATCH
          nullable: false
        operator:
          $ref: "#/components/schemas/LogicalOperator"
        keywords:
          items:
            type: string
          type: array
        caseSensitive:
          type: boolean
      required:
        - evaluationType
        - operator
        - keywords
        - caseSensitive
      type: object
      additionalProperties: false
    RegexConditions:
      properties:
        evaluationType:
          type: string
          enum:
            - REGEX_MATCH
          nullable: false
        expression:
          type: string
        flags:
          type: string
      required:
        - evaluationType
        - expression
        - flags
      type: object
      additionalProperties: false
    GroupConditions:
      properties:
        evaluationType:
          type: string
          enum:
            - RULE_GROUP
          nullable: false
        operator:
          $ref: "#/components/schemas/LogicalOperator"
        childRuleIds:
          items:
            type: string
          type: array
      required:
        - evaluationType
        - operator
        - childRuleIds
      type: object
      additionalProperties: false
    RuleConditions:
      anyOf:
        - $ref: "#/components/schemas/KeywordConditions"
        - $ref: "#/components/schemas/RegexConditions"
        - $ref: "#/components/schemas/GroupConditions"
    RuleMetadata:
      properties:
        createdBy:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - createdAt
        - updatedAt
      type: object
      additionalProperties: false
    Rule:
      properties:
        ruleId:
          type: string
        ruleName:
          type: string
        description:
          type: string
        isActive:
          type: boolean
        scope:
          $ref: "#/components/schemas/Scope"
        conditions:
          $ref: "#/components/schemas/RuleConditions"
        metadata:
          $ref: "#/components/schemas/RuleMetadata"
      required:
        - ruleId
        - ruleName
        - isActive
        - scope
        - conditions
        - metadata
      type: object
      additionalProperties: false
    ListRulesQueryParams:
      properties:
        ruleIds:
          items:
            type: string
          type: array
          description: Optional list of rule IDs to filter by.
      type: object
      additionalProperties: false
    RuleCreate:
      properties:
        ruleName:
          type: string
        description:
          type: string
        isActive:
          type: boolean
        scope:
          $ref: "#/components/schemas/Scope"
        conditions:
          $ref: "#/components/schemas/RuleConditions"
      required:
        - ruleName
        - scope
        - conditions
      type: object
      additionalProperties: false
    RuleUpdate:
      properties:
        ruleName:
          type: string
        description:
          type: string
        isActive:
          type: boolean
        scope:
          $ref: "#/components/schemas/Scope"
        conditions:
          $ref: "#/components/schemas/RuleConditions"
      type: object
      additionalProperties: false
    FeedStatus:
      type: string
      enum:
        - active
        - inactive
        - error
    BackendFeedStatus:
      type: string
      enum:
        - unclaimed
        - active
        - failing
        - quarantined
        - deactivated
    Tag:
      properties:
        key:
          type: string
        value:
          type: string
      required:
        - key
        - value
      type: object
      additionalProperties: false
    BackendFeedStatusReason:
      type: string
      enum:
        - unknown
        - source_offline
        - source_unreachable
        - source_rate_limited
        - system_authentication_failed
        - system_configuration_invalid
        - system_collector_error
        - system_pipeline_error
        - system_unexpected_error
    SourceType:
      enum:
        - bcfy_feeds
        - bcfy_calls
        - echo
        - openmhz
        - fire_notifications
      type: string
    Feed:
      properties:
        name:
          type: string
        sourceType:
          $ref: "#/components/schemas/SourceType"
        id:
          type: string
        sourceFeedId:
          type: string
        sourceUrl:
          type: string
        archiveUrl:
          type: string
        status:
          $ref: "#/components/schemas/FeedStatus"
        substatus:
          $ref: "#/components/schemas/BackendFeedStatus"
        lastHeartbeat:
          type: string
        tags:
          items:
            $ref: "#/components/schemas/Tag"
          type: array
        quarantineReason:
          type: string
        statusReason:
          $ref: "#/components/schemas/BackendFeedStatusReason"
      required:
        - name
        - sourceType
        - id
        - status
        - substatus
      type: object
      additionalProperties: false
    ListFeedsResponse:
      properties:
        feeds:
          items:
            $ref: "#/components/schemas/Feed"
          type: array
        nextToken:
          type: string
        total:
          type: number
          format: double
      required:
        - feeds
        - total
      type: object
      additionalProperties: false
    ListFeedsQueryParams:
      properties:
        limit:
          type: integer
          format: int32
        nextToken:
          type: string
        order:
          type: string
          enum:
            - asc
            - desc
        sourceTypes:
          type: string
        statuses:
          type: string
        tags:
          items:
            type: string
          type: array
        name:
          type: string
      type: object
      additionalProperties: false
    FeedCreate:
      properties:
        name:
          type: string
        sourceType:
          $ref: "#/components/schemas/SourceType"
        sourceFeedId:
          type: string
        tags:
          items:
            $ref: "#/components/schemas/Tag"
          type: array
      required:
        - name
        - sourceType
        - sourceFeedId
      type: object
      additionalProperties: false
    FeedUpdate:
      properties:
        name:
          type: string
        tags:
          items:
            $ref: "#/components/schemas/Tag"
          type: array
      required:
        - name
      type: object
      additionalProperties: false
    OpenApiSpec:
      properties: {}
      type: object
      additionalProperties: {}
    LoginResponse:
      properties:
        idToken:
          type: string
      required:
        - idToken
      type: object
      additionalProperties: false
    LoginRequest:
      properties:
        code:
          type: string
      required:
        - code
      type: object
      additionalProperties: false
    AudioClassification:
      enum:
        - UNSPECIFIED
        - SPEECH
        - OTHER
      type: string
    AnnotationType:
      enum:
        - TRANSCRIPT
        - EVALUATION
      type: string
    TranscriptAnnotationData:
      properties:
        text:
          type: string
        errors:
          items:
            type: string
          type: array
      required:
        - text
        - errors
      type: object
      additionalProperties: false
    EvaluationAnnotationData:
      properties:
        decisions:
          items:
            type: string
          type: array
        errors:
          items:
            type: string
          type: array
      required:
        - decisions
        - errors
      type: object
      additionalProperties: false
    Annotation:
      properties:
        type:
          $ref: "#/components/schemas/AnnotationType"
        createdAt:
          type: string
        data:
          anyOf:
            - $ref: "#/components/schemas/TranscriptAnnotationData"
            - $ref: "#/components/schemas/EvaluationAnnotationData"
      required:
        - type
        - createdAt
        - data
      type: object
      additionalProperties: false
    AudioSegment:
      properties:
        id:
          type: string
        feedId:
          type: string
        classification:
          $ref: "#/components/schemas/AudioClassification"
        startTimestamp:
          type: string
        endTimestamp:
          type: string
        missingPriorContext:
          type: boolean
        missingPostContext:
          type: boolean
        sourceAudioUris:
          items:
            type: string
          type: array
        canonicalAudioUri:
          type: string
        startAudioOffset:
          type: string
        endAudioOffset:
          type: string
        playbackAudioUri:
          type: string
        externalAudioSegmentId:
          type: string
        createdAt:
          type: string
        annotations:
          items:
            $ref: "#/components/schemas/Annotation"
          type: array
      required:
        - id
        - feedId
        - classification
        - startTimestamp
        - endTimestamp
        - missingPriorContext
        - missingPostContext
        - sourceAudioUris
        - createdAt
        - annotations
      type: object
      additionalProperties: false
    ListAudioSegmentsQueryParams:
      properties:
        limit:
          type: integer
          format: int32
          default: 100
        nextToken:
          type: string
        startTime:
          type: string
        endTime:
          type: string
        order:
          type: string
          enum:
            - asc
            - desc
        isAlert:
          type: boolean
      type: object
      additionalProperties: false
    AudioSegmentSummary:
      description: |-
        Lightweight audio segment for timeline rendering. Excludes annotations,
        transcript text, and audio URIs so a whole time window can be fetched cheaply.
      properties:
        id:
          type: string
        feedId:
          type: string
        classification:
          $ref: "#/components/schemas/AudioClassification"
        startTimestamp:
          type: string
        endTimestamp:
          type: string
        isAlert:
          type: boolean
      required:
        - id
        - feedId
        - classification
        - startTimestamp
        - endTimestamp
        - isAlert
      type: object
      additionalProperties: false
    ListAudioSegmentSummariesQueryParams:
      properties:
        startTime:
          type: string
        endTime:
          type: string
          description: ISO-8601; defaults to "now" server-side when omitted.
        limit:
          type: integer
          format: int32
          default: 100
        isAlert:
          type: boolean
        nextToken:
          type: string
          description: Resume cursor from a prior page's nextToken.
      required:
        - startTime
      type: object
      additionalProperties: false
  securitySchemes:
    google_id_token:
      type: oauth2
      flows:
