[project]
name = "rules-service"
version = "0.1.0"
requires-python = ">=3.13, <3.14"

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.10.6",
    "redis>=7.3.0",
    "asyncpg>=0.29.0",
