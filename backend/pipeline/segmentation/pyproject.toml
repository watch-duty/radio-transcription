[project]
name = "segmentation-pipeline"
version = "0.1.0"
requires-python = ">=3.13, <3.14"

dependencies = [
    # IMPORTANT: When updating the apache-beam version here, you must also update
    # the base image version in backend/pipeline/segmentation/Dockerfile to match.
    "apache-beam[gcp]>=2.73.0",
    # Adding betterproto because it's an indirect dependency of beam and is a pre-release version.
    # Since pre-release versions are not permitted in this repo, we list it explicitly here.
    # This allows it to as a dependency for beam without enabling pre-releases globally.
    "betterproto>=2.0.0b6",
    "google-cloud-logging>=3.14.0",
    "protobuf>=5.29.6",
    "crcmod>=1.7",
    "onnxruntime>=1.20.0",
    "pedalboard>=0.9.18",
    "numba>=0.61.0",
    "numpy>=2.2.6",
    "pydantic>=2.12.5",
    "av>=17.1.0",
    "google-cloud-storage>=2.18.2",
    "soundfile>=0.13.1",
    # OpenTelemetry lower-bound pins derived from existing root repository lockfile dependencies configurations
    "opentelemetry-api>=1.41.1",
    "opentelemetry-sdk>=1.41.1",
    "opentelemetry-exporter-gcp-trace>=1.12.0",
]

[tool.setuptools]
packages = []
