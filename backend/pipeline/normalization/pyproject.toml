[project]
name = "normalization-pipeline"
version = "0.1.0"
requires-python = ">=3.13, <3.14"

dependencies = [
    "google-cloud-logging>=3.14.0",
    "protobuf>=5.29.6",
    "numpy>=2.2.6",
    "pydantic>=2.12.5",
    "google-cloud-storage>=2.18.2",
    "google-cloud-pubsub>=2.26.1",
    "tenacity>=9.1.4",
    "soundfile>=0.13.1",
    "cloudevents>=1.11.0",
    "functions-framework>=3.8.1",
    "radio-transcription-common",
    # OpenTelemetry lower-bound pins derived from existing root repository lockfile dependencies configurations
    "opentelemetry-api>=1.41.1",
    "opentelemetry-sdk>=1.41.1",
    "opentelemetry-exporter-gcp-trace>=1.12.0",
]

[tool.setuptools]
packages = []
