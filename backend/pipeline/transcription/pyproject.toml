[project]
name = "transcription-pipeline"
version = "0.1.0"
requires-python = ">=3.13, <3.14"

dependencies = [
    # IMPORTANT: When updating the apache-beam version here, you must also update
    # the base image version in backend/pipeline/transcription/Dockerfile to match.
    "apache-beam[gcp]>=2.72.0",
    # Adding betterproto because it's an indirect dependency of beam and is a pre-release version.
    # Since pre-release versions are not permitted in this repo, we list it explicitly here.
    # This allows it to as a depednency for beam without enabling pre-releases globally.
    "betterproto>=2.0.0b6",
    "google-cloud-speech>=2.37.0",
    "google-cloud-logging>=3.14.0",
    "protobuf>=5.29.6",
    "crcmod>=1.7",
    "onnxruntime>=1.20.0",
    "pedalboard>=0.9.18",
    "numba>=0.61.0",
    "numpy>=2.2.6",
    "scipy>=1.17.1",
    "pydantic>=2.12.5",
    "google-cloud-storage>=2.18.2",
    "tenacity>=9.1.4",
    "soundfile>=0.13.1",
    # OpenTelemetry lower-bound pins derived from existing root repository lockfile dependencies configurations
    "opentelemetry-api>=1.41.1",
    "opentelemetry-sdk>=1.41.1",
    "opentelemetry-exporter-gcp-trace>=1.12.0",
]

[tool.setuptools]
packages = []

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
# Enable flake8-tidy-imports rule (TID) to actively enforce imports conventions
select = ["TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"backend.pipeline.transcription.audio.vad.VoiceActivityDetector".msg = "Import the 'vad' module instead ('from backend.pipeline.transcription.audio import vad') and reference 'vad.VoiceActivityDetector' to comply with Google Style Guide."
"backend.pipeline.transcription.audio.audio_processor.AudioProcessor".msg = "Import the 'audio_processor' module instead ('from backend.pipeline.transcription.audio import audio_processor') and reference 'audio_processor.AudioProcessor' to comply with Google Style Guide."
"backend.pipeline.transcription.resources.SharedResources".msg = "Import the 'resources' module instead ('from backend.pipeline.transcription import resources') and reference 'resources.SharedResources' to comply with Google Style Guide."
"backend.pipeline.transcription.common.datatypes.AudioChunkData".msg = "Import the 'datatypes' module instead ('from backend.pipeline.transcription.common import datatypes') and reference 'datatypes.AudioChunkData' to comply with Google Style Guide."
"backend.pipeline.transcription.common.datatypes.TimeRange".msg = "Import the 'datatypes' module instead ('from backend.pipeline.transcription.common import datatypes') and reference 'datatypes.TimeRange' to comply with Google Style Guide."
