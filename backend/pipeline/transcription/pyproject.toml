[project]
name = "transcription-pipeline"
version = "0.1.0"
requires-python = ">=3.13, <3.14"

dependencies = [
    # IMPORTANT: When updating the apache-beam version here, you must also update
    # the base image version in backend/pipeline/transcription/Dockerfile to match.
    "apache-beam[gcp]>=2.71.0",
    "google-cloud-speech>=2.37.0",
    "google-cloud-logging>=3.14.0",
    "protobuf>=5.29.6",
    "crcmod>=1.7",
    "ten-vad>=1.0.6.8",
    "numpy>=2.2.6",
    "scipy>=1.17.1",
    "pydantic>=2.12.5",
    "google-cloud-storage>=2.18.2",
    "tenacity>=9.1.4",
    "soundfile>=0.13.1",
]

[tool.setuptools]
packages = []
