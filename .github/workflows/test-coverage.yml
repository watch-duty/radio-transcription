name: Test Coverage Report

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'model/colabs/**'
      - '**.md'

permissions:
  contents: read
  pull-requests: write
  packages: read

jobs:
  unit-coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Cache APT packages
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: ffmpeg libomp5-18
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libomp5 libc++1 libc++abi1
      - name: Install mise, install tools
        uses: jdx/mise-action@v3
      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-
      - name: Install dependencies
        run: uv sync
      - name: Generate protos
        run: mise run generate:protos
      - name: Run Unit Tests with Coverage
        run: |
          set -o pipefail
          uv run pytest backend/ --cov=backend/pipeline --cov-report=term-missing | tee unit-coverage.txt || true
      - name: Upload unit coverage
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: unit-coverage.txt

  storage-coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install mise, install tools
        uses: jdx/mise-action@v3
      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-
      - name: Generate protos
        run: mise run generate:protos
      - name: Install dependencies
        run: uv sync
      - name: Pre-pull Testcontainers images
        run: |
          docker pull testcontainers/ryuk:0.8.1 || true
          docker pull google/alloydbomni:15 || true
          docker pull fsouza/fake-gcs-server:latest || true
      - name: Run Storage Integration Tests with Coverage
        run: |
          set -o pipefail
          uv run pytest integration_tests/storage/ --cov=backend/pipeline --cov-report=term-missing | tee storage-coverage.txt || true
      - name: Upload storage coverage
        uses: actions/upload-artifact@v4
        with:
          name: storage-coverage
          path: storage-coverage.txt

  e2e-coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Free up disk space (Host SSD)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
      - name: Pull persistent staging base images from ghcr.io
        run: docker compose -f docker-compose.yml pull --ignore-pull-failures
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Load pre-compiled microservice binaries from GHA cache
        run: |
          docker buildx bake \
            --set *.cache-from=type=gha,scope=integration-tests \
            -f docker-compose.yml \
            --load
      - name: Run E2E Integration Tests with Coverage
        run: |
          set -o pipefail
          docker compose -f docker-compose.yml --env-file local_dev/LOCAL.env run --rm integration-tests sh -c "pip install -q uv && uv sync && uv run python -m grpc_tools.protoc -I=protos --python_out=backend/pipeline/schema_types protos/*.proto && uv run pytest integration_tests/ --ignore=integration_tests/storage/ -n auto -v -s --cov=backend/pipeline --cov-report=term-missing | tee e2e-coverage.txt" || true
      - name: Clean up containers
        if: always()
        run: docker compose -f docker-compose.yml --env-file local_dev/LOCAL.env down --remove-orphans
      - name: Upload e2e coverage
        uses: actions/upload-artifact@v4
        with:
          name: e2e-coverage
          path: e2e-coverage.txt

  report-coverage:
    needs: [unit-coverage, storage-coverage, e2e-coverage]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download unit coverage
        uses: actions/download-artifact@v4
        with:
          name: unit-coverage
      - name: Download storage coverage
        uses: actions/download-artifact@v4
        with:
          name: storage-coverage
      - name: Download e2e coverage
        uses: actions/download-artifact@v4
        with:
          name: e2e-coverage
      - name: Comment PR with coverage
        uses: MishaKav/pytest-coverage-comment@main
        with:
          multiple-files: title-Unit Tests, unit-coverage.txt, title-E2E Integration Tests, e2e-coverage.txt, title-Storage Integration Tests, storage-coverage.txt
