name: Trigger Private Deployment

on:
  push:
    branches: [main]

jobs:
  signal-private:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 

      - name: Check for Module Changes
        id: filter
        run: |
          # Check if any files in terraform/modules/ or protos/ changed (infra inputs)
          INFRA_CHANGED=$(git diff --name-only HEAD^ HEAD | grep -E '^(terraform/modules/|protos/)' || true)
          if [ -n "$INFRA_CHANGED" ]; then
            echo "infra_change=true" >> $GITHUB_OUTPUT
          else
            echo "infra_change=false" >> $GITHUB_OUTPUT
          fi

      - name: Notify Private Repo
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          if [ "${{ steps.filter.outputs.infra_change }}" == "true" ]; then
            echo "Infra change detected. Triggering Infrastructure + App deployment..."
            gh workflow run deploy.yml --repo ${{ secrets.PRIVATE_REPO_TARGET }} -f app_deploy_sha=${{ github.sha }} -f environment=dev -f deploy_release=true
          else
            echo "App code change only. Triggering App Deployment..."
            gh workflow run deploy.yml --repo ${{ secrets.PRIVATE_REPO_TARGET }} -f app_deploy_sha=${{ github.sha }} -f environment=dev -f deploy_release=true
          fi