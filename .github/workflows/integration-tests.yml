name: Integration Tests

on:
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Whether to start SSH session for debugging'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
    paths-ignore:
      - 'model/colabs/**'
      - '**.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'model/colabs/**'
      - '**.md'

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  component-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install mise, install tools
        uses: jdx/mise-action@v3

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Generate protos
        run: mise run generate:protos

      - name: Run component tests
        run: |
          set -o pipefail
          mise run test:component --cov=backend/pipeline --cov-report=term-missing --color=no | python3 -c "
          import sys
          in_cov = False
          cov = []
          for line in sys.stdin:
              if 'tests coverage' in line and '====' in line:
                  in_cov = True
              if in_cov:
                  cov.append(line)
              else:
                  sys.stdout.write(line)
                  sys.stdout.flush()
          with open('storage-coverage.txt', 'w') as f:
              f.writelines(cov)
          "
          
      - name: Extract Storage Coverage
        id: extract_storage_cov
        if: always()
        run: |
          if [ -f storage-coverage.txt ]; then
            PCT=$(grep -i "TOTAL" storage-coverage.txt | awk '{print $NF}')
            if [ -n "$PCT" ]; then
              echo "PERCENTAGE=$PCT" >> $GITHUB_ENV
            fi
          fi
      - name: Rename Check Run
        uses: actions/github-script@v7
        if: always() && env.PERCENTAGE != ''
        with:
          script: |
            const fs = require('fs');
            const ref = context.payload.pull_request ? context.payload.pull_request.head.sha : context.sha;
            let summary = 'No coverage report found';
            if (fs.existsSync('storage-coverage.txt')) {
              const content = fs.readFileSync('storage-coverage.txt', 'utf8');
              summary = `### Coverage Report\n\n\`\`\`\n${content}\n\`\`\``;
            }
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_sha: ref,
              name: `Storage Integration Coverage: ${process.env.PERCENTAGE}`,
              status: 'completed',
              conclusion: 'success',
              output: {
                title: `Storage Integration Coverage: ${process.env.PERCENTAGE}`,
                summary: summary,
              }
            });

  e2e-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free up disk space (Host SSD)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Pull persistent staging base images from ghcr.io
        run: docker compose -f docker-compose.yml pull --ignore-pull-failures

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Load pre-compiled microservice binaries from GHA cache
        run: |
          docker buildx bake \
            --set *.cache-from=type=gha,scope=integration-tests \
            -f docker-compose.yml \
            --load

      - name: Run E2E tests
        run: |
          set -o pipefail
          docker compose -f docker-compose.yml --env-file local_dev/LOCAL.env run --rm integration-tests sh -c "pip install -q uv && uv sync && uv run python -m grpc_tools.protoc -I=protos --python_out=backend/pipeline/schema_types protos/*.proto && uv run pytest integration_tests/ --ignore=integration_tests/storage/ -n auto -v -s --log-cli-level=INFO --cov=backend/pipeline --cov-report=term-missing --color=no" | python3 -c "
          import sys
          in_cov = False
          cov = []
          for line in sys.stdin:
              if 'tests coverage' in line and '====' in line:
                  in_cov = True
              if in_cov:
                  cov.append(line)
              else:
                  sys.stdout.write(line)
                  sys.stdout.flush()
          with open('e2e-coverage.txt', 'w') as f:
              f.writelines(cov)
          "

      - name: Extract E2E Coverage
        id: extract_e2e_cov
        if: always()
        run: |
          if [ -f e2e-coverage.txt ]; then
            PCT=$(grep -i "TOTAL" e2e-coverage.txt | awk '{print $NF}')
            if [ -n "$PCT" ]; then
              echo "PERCENTAGE=$PCT" >> $GITHUB_ENV
            fi
          fi
      - name: Rename Check Run
        uses: actions/github-script@v7
        if: always() && env.PERCENTAGE != ''
        with:
          script: |
            const fs = require('fs');
            const ref = context.payload.pull_request ? context.payload.pull_request.head.sha : context.sha;
            let summary = 'No coverage report found';
            if (fs.existsSync('e2e-coverage.txt')) {
              const content = fs.readFileSync('e2e-coverage.txt', 'utf8');
              summary = `### Coverage Report\n\n\`\`\`\n${content}\n\`\`\``;
            }
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_sha: ref,
              name: `E2E Integration Coverage: ${process.env.PERCENTAGE}`,
              status: 'completed',
              conclusion: 'success',
              output: {
                title: `E2E Integration Coverage: ${process.env.PERCENTAGE}`,
                summary: summary,
              }
            });

      - name: Print container logs on failure
        if: failure()
        run: docker compose --env-file local_dev/LOCAL.env logs

      - name: Clean up containers
        if: always()
        run: docker compose -f docker-compose.yml --env-file local_dev/LOCAL.env down --remove-orphans

      - name: Open SSH session if workflow fails
        uses: mxschmitt/action-tmate@v3
        if: always() && github.event_name == 'workflow_dispatch' && inputs.debug_enabled
