name: Integration Tests

on:
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Whether to start SSH session for debugging'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  run-integration-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run integration tests
        run: docker compose run --rm integration-tests

      - name: Open SSH session if workflow fails
        uses: mxschmitt/action-tmate@v3
        if: failure() && inputs.debug_enabled
