name: Integration Tests

on:
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Whether to start SSH session for debugging'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  component-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install mise, install tools
        uses: jdx/mise-action@v3

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Generate protos
        run: mise run generate:protos

      - name: Run component tests
        run: mise run test:component

  e2e-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install mise, install tools
        uses: jdx/mise-action@v3

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build microservices using Buildx Bake (with caching)
        run: |
          docker buildx bake \
            --set *.cache-from=type=gha,scope=integration-tests \
            --set *.cache-to=type=gha,mode=max,scope=integration-tests \
            -f docker-compose.yml \
            --load

      - name: Run E2E tests
        run: mise run test:e2e

      - name: Print container logs on failure
        if: failure()
        run: docker compose --env-file local_dev/LOCAL.env logs

      - name: Open SSH session if workflow fails
        uses: mxschmitt/action-tmate@v3
        if: always() && github.event_name == 'workflow_dispatch' && inputs.debug_enabled
