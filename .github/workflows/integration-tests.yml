name: Integration Tests

on:
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Whether to start SSH session for debugging'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  component-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install mise, install tools
        uses: jdx/mise-action@v3

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Generate protos
        run: mise run generate:protos

      - name: Run component tests
        run: mise run test:component

  e2e-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free up disk space (Host SSD)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Pull persistent staging base images from ghcr.io
        run: docker compose -f docker-compose.yml pull --ignore-pull-failures

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Load pre-compiled microservice binaries from GHA cache
        run: |
          docker buildx bake \
            --set *.cache-from=type=gha,scope=integration-tests \
            -f docker-compose.yml \
            --load

      - name: Run E2E tests
        run: |
          docker compose -f docker-compose.yml --env-file local_dev/LOCAL.env run --rm integration-tests sh -c "pip install -q uv && uv sync && uv run python -m grpc_tools.protoc -I=protos --python_out=backend/pipeline/schema_types protos/*.proto && uv run pytest integration_tests/ --ignore=integration_tests/storage/ -n auto -v -s --log-cli-level=INFO"

      - name: Print container logs on failure
        if: failure()
        run: docker compose --env-file local_dev/LOCAL.env logs

      - name: Clean up containers
        if: always()
        run: docker compose -f docker-compose.yml --env-file local_dev/LOCAL.env down --remove-orphans

      - name: Open SSH session if workflow fails
        uses: mxschmitt/action-tmate@v3
        if: always() && github.event_name == 'workflow_dispatch' && inputs.debug_enabled
