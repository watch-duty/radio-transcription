name: Integration Tests

on:
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Whether to start SSH session for debugging'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  component-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install mise, install tools
        uses: jdx/mise-action@v3

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Generate protos
        run: mise run generate:protos

      - name: Run component tests
        run: mise run test:component

  build-e2e-base:
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free up disk space for Docker compilation
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Bake and push all microservices to ghcr.io
        run: |
          docker buildx bake \
            --set *.cache-from=type=gha,scope=integration-tests \
            --set *.cache-to=type=gha,mode=max,scope=integration-tests \
            -f docker-compose.yml

  e2e-tests:
    needs: [build-e2e-base]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        test_lane: ['integration_tests/api/', 'integration_tests/e2e/']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free up disk space (Host SSD)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

      - name: Install mise, install tools
        uses: jdx/mise-action@v3

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies (host)
        run: uv sync

      - name: Generate protobufs (host)
        run: mise run generate:protos

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Load pre-built microservices from GHA cache
        run: |
          docker buildx bake \
            --set *.cache-from=type=gha,scope=integration-tests \
            -f docker-compose.yml \
            --load

      - name: Run E2E test shard (${{ matrix.test_lane }})
        run: |
          docker compose -f docker-compose.yml --env-file local_dev/LOCAL.env run -e PYTHONPATH=/app/.venv/lib/python3.13/site-packages:/app --rm integration-tests python -m pytest ${{ matrix.test_lane }} -n auto -v -s --log-cli-level=INFO

      - name: Clean up containers
        if: always()
        run: docker compose -f docker-compose.yml --env-file local_dev/LOCAL.env down --remove-orphans

      - name: Print container logs on failure
        if: failure()
        run: docker compose --env-file local_dev/LOCAL.env logs

      - name: Open SSH session if workflow fails
        uses: mxschmitt/action-tmate@v3
        if: always() && github.event_name == 'workflow_dispatch' && inputs.debug_enabled
