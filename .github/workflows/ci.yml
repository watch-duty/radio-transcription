name: Radio Transcription CI

on: [push, workflow_call]

permissions:
  contents: read
  actions: read
  packages: read
  checks: write

jobs:
  setup:
    runs-on: ubuntu-24.04
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      requires_backend: ${{ steps.filter.outputs.requires_backend }}
      requires_model: ${{ steps.filter.outputs.requires_model }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - name: Check if workflow already passed for this commit
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              head_sha: context.sha,
              status: 'completed',
              conclusion: 'success'
            });
            const alreadyPassed = runs.data.workflow_runs.length > 0;
            core.setOutput('should_run', alreadyPassed ? 'false' : 'true');
            if (alreadyPassed) {
              core.notice('Workflow already passed for this commit, skipping all jobs');
            }
      - name: Detect file changes for smart job routing
        id: filter
        if: steps.check.outputs.should_run == 'true'
        run: |
          # 1. Fetch upstream base commit cleanly without entirely suppressing network exit codes
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if [ -n "$BASE_SHA" ]; then
            git fetch origin "${{ github.event.pull_request.base.ref }}" 2>/dev/null
            FILES=$(git diff --name-only "$BASE_SHA" "${{ github.event.pull_request.head.sha }}" 2>/dev/null)
          else
            git fetch origin main 2>/dev/null
            FILES=$(git diff --name-only origin/main HEAD 2>/dev/null || git diff --name-only HEAD~1 HEAD)
          fi
          echo "Modified files: $FILES"

          # 2. Filter A: requires_backend. If any modified file falls OUTSIDE model/ and .md, we require backend runs.
          # Note: grep -v inverts match per line. If any modified file is not a model/ or .md file, it returns true (exit 0).
          if echo "$FILES" | grep -qvE '^(model/|.*\.md)'; then
            echo "requires_backend=true" >> $GITHUB_OUTPUT
          else
            echo "requires_backend=false" >> $GITHUB_OUTPUT
          fi

          # 3. Filter B: requires_model. If any modified file touches model/ or .github/workflows/, we require model runs.
          if echo "$FILES" | grep -qE '^(model/|\.github/workflows/)'; then
            echo "requires_model=true" >> $GITHUB_OUTPUT
          else
            echo "requires_model=false" >> $GITHUB_OUTPUT
          fi
      - name: Validate merge with main (fail fast on conflicts)
        if: steps.check.outputs.should_run == 'true'
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git fetch origin main
          git merge origin/main --no-edit || (echo "Merge conflicts detected. Please resolve conflicts." && exit 1)

  code-quality-checks-python:
    needs: [setup]
    # Gated on both backend and model changes to ensure Colab notebook JSON schemas and Ruff Python formatting are strictly enforced across all ML and API PRs
    if: needs.setup.outputs.should_run == 'true' && (needs.setup.outputs.requires_backend == 'true' || needs.setup.outputs.requires_model == 'true')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - name: Install mise, install tools
        # mise installs uv and other project-specific tools. see: .tool-versions
        uses: jdx/mise-action@v3
      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-
      - name: Install dependencies
        run: uv sync
      - name: Generate Protobuf Python files
        run: mise run generate:protos
      - name: Validate protobuf schemas
        run: mise run lint:schemas
      - name: Run Python code quality checks
        run: mise run lint:python

  run-model-tests:
    needs: [setup]
    if: needs.setup.outputs.should_run == 'true' && needs.setup.outputs.requires_model == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - name: Install mise, install tools
        uses: jdx/mise-action@v3
      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-
      - name: Install dependencies
        run: uv sync
      - name: Generate Protobuf Python files
        run: mise run generate:protos
      - name: Run model unit tests
        run: mise run test:model

  code-quality-checks-typescript:
    needs: [setup]
    if: needs.setup.outputs.should_run == 'true' && needs.setup.outputs.requires_backend == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - name: Install mise, install tools
        uses: jdx/mise-action@v3
      - name: Enable Corepack (node package manager)
        run: corepack enable
      - name: Build and install common
        working-directory: frontend/common
        run: yarn install --frozen-lockfile --non-interactive && yarn build
      - name: Install dependencies
        run: yarn --cwd frontend/api install --frozen-lockfile --non-interactive && yarn --cwd frontend/transcription-ui install --frozen-lockfile --non-interactive
      - name: Run ESLint
        run: yarn --cwd frontend/api lint:check && yarn --cwd frontend/transcription-ui lint:check
      - name: Run Prettier
        run: yarn --cwd frontend/api format:check && yarn --cwd frontend/transcription-ui format:check
      - name: Build packages
        run: yarn --cwd frontend/api build && yarn --cwd frontend/transcription-ui build:dev
      - name: Generate routes
        working-directory: frontend/api
        run: yarn generate-routes
      - name: Verify OpenAPI Spec
        working-directory: frontend/api
        run: yarn verify-spec
      - name: Type check API
        working-directory: frontend/api
        run: npx tsc --noEmit
      - name: Type check UI
        working-directory: frontend/transcription-ui
        run: npx tsc --noEmit

  terraform-checks:
    needs: [setup]
    if: needs.setup.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - name: Install mise, install tools
        uses: jdx/mise-action@v3
      - name: Validate Terraform
        run: mise run lint:terraform


  run-backend-tests:
    needs: [setup]
    if: needs.setup.outputs.should_run == 'true' && needs.setup.outputs.requires_backend == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - name: Install mise, install tools
        # mise installs uv and other project-specific tools. see: .tool-versions
        uses: jdx/mise-action@v3
      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-
      - name: Cache pytest cache
        uses: actions/cache@v4
        with:
          path: .pytest_cache
          key: ${{ runner.os }}-pytest-${{ hashFiles('backend/**/*.py') }}
          restore-keys: |
            ${{ runner.os }}-pytest-
      - name: Install dependencies
        run: uv sync
      - name: Generate Protobuf Python files
        run: mise run generate:protos
      - name: Pre-pull Testcontainers images
        run: |
          docker pull testcontainers/ryuk:0.8.1 || true
          docker pull google/alloydbomni:15 || true
          docker pull fsouza/fake-gcs-server:latest || true
      - name: Run tests
        run: |
          set -o pipefail
          uv run python -m pytest backend/ -q --cov=backend/pipeline --cov-report=term-missing --color=no \
            | python3 $GITHUB_WORKSPACE/.github/scripts/filter_coverage.py -o backend_unit_test_coverage.txt
      - name: Create Coverage Check Run
        uses: ./.github/actions/post-backend-coverage
        if: always()
        with:
          name: "Backend Unit Test Coverage"
          coverage-report-location: "backend_unit_test_coverage.txt"

  run-frontend-tests:
    needs: [setup]
    if: needs.setup.outputs.should_run == 'true' && needs.setup.outputs.requires_backend == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - name: Install mise, install tools
        uses: jdx/mise-action@v3
      - name: Enable Corepack (node package manager)
        run: corepack enable
      - name: Build and install common
        working-directory: frontend/common
        run: yarn install --frozen-lockfile --non-interactive && yarn build
      - name: Install dependencies
        run: yarn --cwd frontend/api install --frozen-lockfile --non-interactive && yarn --cwd frontend/transcription-ui install --frozen-lockfile --non-interactive
      - name: Run proxy tests
        working-directory: frontend/api
        run: |
          set -o pipefail
          yarn test --watch=false --coverage --coverage.all --coverage.include=src/**/* --coverage.reporter=json-summary --coverage.reporter=text --no-color \
            | python3 $GITHUB_WORKSPACE/.github/scripts/filter_coverage.py -o frontend_api_test_coverage.txt
      - name: Create Frontend Proxy Coverage Check Run
        uses: ./.github/actions/post-frontend-coverage
        if: always()
        with:
          name: "Frontend Proxy API Coverage"
          coverage-report-location: "frontend/api/frontend_api_test_coverage.txt"
          json-summary-location: "frontend/api/coverage/coverage-summary.json"
      - name: Run UI tests
        working-directory: frontend/transcription-ui
        run: |
          set -o pipefail
          yarn test --watch=false --coverage --coverage.all --coverage.include=src/**/* --coverage.reporter=json-summary --coverage.reporter=text --no-color \
            | python3 $GITHUB_WORKSPACE/.github/scripts/filter_coverage.py -o frontend_ui_test_coverage.txt
      - name: Create UI Coverage Check Run
        uses: ./.github/actions/post-frontend-coverage
        if: always()
        with:
          name: "Frontend UI Coverage"
          coverage-report-location: "frontend/transcription-ui/frontend_ui_test_coverage.txt"
          json-summary-location: "frontend/transcription-ui/coverage/coverage-summary.json"

  # Builds each service's Dockerfile and verifies all transitive imports resolve
  # and required environment variables are documented. This catches:
  #   1. Missing dependencies in per-service requirements.txt (unit tests install
  #      from pyproject.toml which has all deps, masking per-service gaps).
  #   2. New required env vars added via _require_env() but not yet wired into
  #      the deployment Terraform — the settings instantiation step fails if any
  #      required var is missing from the explicit -e list below.
  # NOTE: evaluation/notification are excluded because their
  # Dockerfiles don't generate protobuf files yet. Add them here once their
  # Dockerfiles include protobuf generation.
  docker-smoke-test:
    needs: [setup]
    if: needs.setup.outputs.should_run == 'true' && needs.setup.outputs.requires_backend == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build ingestion Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/pipeline/ingestion/Dockerfile
          tags: ingestion-smoke-test:latest
          cache-from: type=gha,scope=ingestion
          cache-to: type=gha,mode=max,scope=ingestion
          load: true
      - name: Build transcription Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/pipeline/transcription/Dockerfile
          tags: transcription-smoke-test:latest
          cache-from: type=gha,scope=transcription
          cache-to: type=gha,mode=max,scope=transcription
          load: true
      # PUBSUB_EMULATOR_HOST bypasses GCP credential resolution in the
      # module-level PublisherClient() instantiation in collector_runtime.py.
      # Without it, the Pub/Sub SDK attempts ADC which fails inside Docker.
      - name: Verify ingestion imports
        run: |
          docker run --rm \
            -e BROADCASTIFY_USERNAME=smoke-test \
            -e BROADCASTIFY_PASSWORD=smoke-test \
            -e PUBSUB_EMULATOR_HOST=localhost:8085 \
            ingestion-smoke-test \
            python -c "import backend.pipeline.ingestion.main"
      - name: Verify VM Health agent import
        run: |
          docker run --rm \
            ingestion-smoke-test \
            python -c "import backend.pipeline.ingestion.vm_health_agent"
      - name: Verify ingestion settings instantiation
        run: |
          docker run --rm \
            -e BROADCASTIFY_USERNAME=smoke-test \
            -e BROADCASTIFY_PASSWORD=smoke-test \
            -e PUBSUB_EMULATOR_HOST=localhost:8085 \
            -e AUDIO_STAGING_BUCKET=smoke-test-bucket \
            -e CONTINUOUS_PUBSUB_TOPIC_PATH=projects/test/topics/test \
            -e ALLOYDB_HOST=localhost \
            -e ALLOYDB_USER=worker \
            -e ALLOYDB_DB=postgres \
            ingestion-smoke-test \
            python -c "from backend.pipeline.ingestion.settings import CollectorSettings; CollectorSettings()"

  # Applies the ingestion DDL twice to a disposable PostgreSQL 16 service,
  # runs a small behavior smoke check, then verifies the existing HOT-update
  # invariant. Replaying the real migrations catches idempotency problems
  # without duplicating their schema definitions in CI.
  alloydb-hot-protection-check:
    needs: [setup]
    if: needs.setup.outputs.should_run == 'true' && needs.setup.outputs.requires_backend == 'true'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply ingestion SQL migrations twice (excluding pg_cron jobs)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        working-directory: terraform/modules/alloydb/sql/ingestion
        run: |
          set -euo pipefail
          # Bash expands globs alphabetically in the current locale, so no
          # explicit sort is needed (and parsing `ls` is fragile with odd
          # filenames).
          for pass in 1 2; do
            for f in *.sql; do
              case "$f" in
                *pg_cron*)
                  echo "Pass $pass: skipping $f (pg_cron extension not installed in CI)";
                  continue;;
              esac
              echo "Pass $pass: applying $f..."
              psql -v ON_ERROR_STOP=1 -f "$f"
            done
          done
      - name: Run Phase 1 behavior smoke check
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: >-
          psql -v ON_ERROR_STOP=1
          -f terraform/modules/alloydb/sql/ci/ingestion_leases_behavior_check.sql
      - name: Run HOT-protection guard
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: |
          set -euo pipefail

          guard_sql="terraform/modules/alloydb/sql/ci/hot_protection_check.sql"

          cleanup_hot_guard_fixtures() {
            psql -v ON_ERROR_STOP=1 \
              -c "DROP INDEX IF EXISTS hot_guard_direct_fixture" \
              -c "DROP INDEX IF EXISTS hot_guard_predicate_fixture" \
              -c "DROP INDEX IF EXISTS hot_guard_expression_fixture" \
              >/dev/null
          }
          trap cleanup_hot_guard_fixtures EXIT

          run_hot_guard() {
            psql -v ON_ERROR_STOP=1 -t -A -f "$guard_sql"
          }

          assert_hot_guard_clean() {
            local violations
            violations=$(run_hot_guard)
            if [ -n "$violations" ]; then
              echo "::error::HOT-protection violation(s) detected:"
              echo "$violations"
              echo "An index on the feeds table references a mutated hot-path"
              echo "column. This will defeat HOT updates and cause table bloat."
              echo "See sql/ci/hot_protection_check.sql for the guarded column list."
              exit 1
            fi
          }

          assert_hot_guard_reports() {
            local expected="$1"
            local violations
            violations=$(run_hot_guard)
            if [ "$violations" != "$expected" ]; then
              echo "::error::HOT-protection fixture did not report expected violation:"
              echo "Expected: $expected"
              echo "Actual:"
              echo "$violations"
              exit 1
            fi
          }

          assert_hot_guard_clean

          psql -v ON_ERROR_STOP=1 \
            -c "CREATE INDEX hot_guard_direct_fixture ON feeds (last_heartbeat)"
          assert_hot_guard_reports "hot_guard_direct_fixture|last_heartbeat|direct"
          psql -v ON_ERROR_STOP=1 -c "DROP INDEX hot_guard_direct_fixture"

          psql -v ON_ERROR_STOP=1 \
            -c "CREATE INDEX hot_guard_predicate_fixture ON feeds (id) WHERE last_heartbeat IS NOT NULL"
          assert_hot_guard_reports "hot_guard_predicate_fixture|last_heartbeat|derived"
          psql -v ON_ERROR_STOP=1 -c "DROP INDEX hot_guard_predicate_fixture"

          psql -v ON_ERROR_STOP=1 \
            -c "CREATE INDEX hot_guard_expression_fixture ON feeds ((COALESCE(worker_id::text, 'missing')))"
          assert_hot_guard_reports "hot_guard_expression_fixture|worker_id|derived"
          psql -v ON_ERROR_STOP=1 -c "DROP INDEX hot_guard_expression_fixture"

          assert_hot_guard_clean
          echo "HOT-protection check passed: no index references a guarded column."

  # The unit suite mocks asyncpg. Exercise the dormant fenced storage
  # contracts against every supported PostgreSQL major so SQL behavior and
  # fence transitions are proven before the runtime consumes these APIs.
  ingestion-lease-lifecycle-postgres:
    needs: [setup]
    if: needs.setup.outputs.should_run == 'true' && needs.setup.outputs.requires_backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        postgres-version: ["15", "16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install mise and project tools
        uses: jdx/mise-action@v3
      - name: Install dependencies
        run: uv sync
      - name: Apply ingestion migrations twice
        env:
          EXPECTED_POSTGRES_MAJOR: ${{ matrix.postgres-version }}
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: scripts/ci/ingestion_runtime_privilege_gate.sh apply-schema
      - name: Run dedicated runtime and serial Lease storage proofs
        env:
          EXPECTED_POSTGRES_MAJOR: ${{ matrix.postgres-version }}
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: scripts/ci/ingestion_runtime_privilege_gate.sh prove
