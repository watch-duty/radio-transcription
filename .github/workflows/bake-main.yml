name: Bake Staging Base Images

on:
  push:
    branches:
      - main

permissions:
  packages: write
  contents: read

jobs:
  bake-base:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free up disk space for Docker compilation
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/local/share/boost \
            /usr/local/julia* \
            /usr/local/aws* \
            /usr/share/swift \
            /usr/share/az_* \
            /usr/share/sbt \
            /var/lib/mongodb
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile || true
          sudo apt-get remove --purge -y azure-cli google-cloud-cli google-chrome-stable firefox powershell mono-devel libgl1-mesa-dri || true
          sudo apt-get autoremove -y || true
          sudo apt-get clean
          sudo docker system prune --all --volumes --force

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Bake and push persistent staging base images to ghcr.io
        run: |
          docker buildx bake \
            --set *.cache-from=type=gha,scope=integration-tests \
            --set *.cache-to=type=gha,mode=max,scope=integration-tests \
            --push \
            -f docker-compose.yml
