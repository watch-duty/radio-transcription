name: 'Free Disk Space'
description: 'Frees host SSD disk space on GitHub Actions runner'

runs:
  using: 'composite'
  steps:
    - name: Free up disk space (Host SSD)
      shell: bash
      run: |
        sudo rm -rf \
          /usr/share/dotnet \
          /usr/local/lib/android \
          /opt/ghc \
          /opt/hostedtoolcache \
          /usr/local/share/powershell \
          /usr/local/share/chromium \
          /usr/local/share/boost \
          /usr/local/julia* \
          /usr/local/aws* \
          /usr/share/swift \
          /usr/share/az_* \
          /usr/share/sbt \
          /var/lib/mongodb
        sudo swapoff -a || true
        sudo rm -f /mnt/swapfile /swapfile || true
        sudo apt-get remove --purge -y azure-cli google-cloud-cli google-chrome-stable firefox powershell mono-devel libgl1-mesa-dri
        sudo apt-get autoremove -y
        sudo apt-get clean
        sudo docker system prune --all --volumes --force
