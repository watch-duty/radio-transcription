services:
  # Container for running NeMO and Jupyter Notebooks on GPU (using notebook from NeMO image)
  asr-eval:
    build:
      context: .
      dockerfile: model/nemo_docker/Dockerfile
    ports:
      - "8888:8888"
    volumes:
      - ./model:/app
    working_dir: /app
    environment:
      - LD_LIBRARY_PATH=/opt/venv/lib/python3.12/site-packages/torch/lib:/usr/local/cuda/lib64:/usr/local/nvidia/lib:/usr/local/nvidia/lib64
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Override entrypoint to start Jupyter Notebook instead of ZSH
    entrypoint: ["jupyter", "notebook", "--ip=0.0.0.0", "--allow-root", "--no-browser", "--NotebookApp.token=''", "--NotebookApp.password=''"]

  # Contianer for running NeMO and Jupyter without GPU
  asr-eval-cpu:
    build:
      context: .
      dockerfile: model/nemo_docker/Dockerfile
    ports:
      - "8888:8888"
    volumes:
      - ./model:/app
    working_dir: /app
    # Override entrypoint to start Jupyter Notebook instead of ZSH
    entrypoint: ["jupyter", "notebook", "--ip=0.0.0.0", "--allow-root", "--no-browser", "--NotebookApp.token=''", "--NotebookApp.password=''"]

  # Lightweight container for simply running Jupyter notebooks (without NeMO)
  notebooks:
    build:
      context: ./model/notebook_docker
      dockerfile: Dockerfile
    ports:
      - "8888:8888"
    environment:
      - LD_LIBRARY_PATH=/usr/local/cuda/lib64:/usr/local/nvidia/lib:/usr/local/nvidia/lib64
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: ["jupyter", "notebook", "--ip=0.0.0.0", "--allow-root", "--NotebookApp.token=''", "--NotebookApp.password=''"]
    volumes:
      - ./model:/home/jovyan/model