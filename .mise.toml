[settings]
# Automatically use uv virtual environment if available
python.uv_venv_auto = true

[env]
_.file = ".env"

# Set PYTHONPATH to repository root for easier imports
PYTHONPATH = "."

[vars]
backend_dir = "backend"
frontend_dir = "frontend"

# ---------------------------------------------------------------------------- #
#                              Code Quality Tasks                              #
# ---------------------------------------------------------------------------- #

[tasks.lint]
depends = ["lint:python", "lint:terraform", "lint:frontend"]

[tasks."lint:ruff:check"]
description = "Run ruff linter check"
run = "uv run ruff check"

[tasks."lint:ruff:format"]
description = "Run ruff format check"
run = "uv run ruff format --check"

[tasks."lint:ruff:sorted"]
description = "Verify ruff ignore lists are sorted"
run = """
uv run python -c "
import tomllib, sys
with open('pyproject.toml', 'rb') as f:
    cfg = tomllib.load(f)
errors = []
codes = [c for c in cfg['tool']['ruff']['lint']['ignore'] if not c.startswith('#')]
if codes != sorted(codes):
    errors.append('tool.ruff.lint.ignore is not sorted')
for pattern, codes in cfg['tool']['ruff']['lint'].get('per-file-ignores', {}).items():
    filtered = [c for c in codes if not c.startswith('#')]
    if filtered != sorted(filtered):
        errors.append(f'per-file-ignores[{pattern!r}] is not sorted')
if errors:
    print('\\n'.join(errors), file=sys.stderr)
    sys.exit(1)
print('All ruff ignore lists are sorted')
"
"""

[tasks."lint:ruff"]
description = "Run all ruff checks"
depends = ["lint:ruff:check", "lint:ruff:format", "lint:ruff:sorted"]

[tasks."lint:ty"]
description = "Run ty Python type-checker"
run = "uv run ty check"

[tasks."lint:terraform"]
description = "Validate Terraform code and check formatting for pre-submits"
run = """
terraform validate
terraform fmt -check -recursive
"""

[tasks."lint:frontend:eslint"]
description = "Run ESLint checks for frontend"
run = "yarn --cwd frontend/api run lint:check && yarn --cwd frontend/transcription-ui run lint:check"

[tasks."lint:frontend:prettier"]
description = "Run Prettier checks for frontend"
run = "yarn --cwd frontend/api run format:check && yarn --cwd frontend/transcription-ui run format:check"

[tasks."lint:frontend:tsc"]
description = "Run Type checks for frontend"
run = "yarn --cwd frontend/api run typecheck && yarn --cwd frontend/transcription-ui run typecheck"

[tasks."lint:frontend"]
description = "Run all frontend lint checks"
depends = ["lint:frontend:eslint", "lint:frontend:prettier", "lint:frontend:tsc"]

[tasks."lint:notebooks"]
description = "Lint notebooks for schema issues and formatting in model/colabs"
run = """
uv run python scripts/notebook_formatter.py
uv run ruff format --check model/colabs
"""

[tasks."lint:python"]
description = "Run all Python code quality and type checks"
depends = ["lint:ruff", "lint:ty", "lint:notebooks"]

[tasks.format]
depends = ["format:ruff", "format:terraform", "format:frontend"]

[tasks."format:ruff"]
description = "Format Python code with ruff"
depends = ["format:notebooks"]
run = "uv run ruff format"

[tasks."format:notebooks"]
description = "Fix schema issues and format notebooks in model/colabs"
run = """
uv run python scripts/notebook_formatter.py --write
uv run ruff format model/colabs
"""

[tasks."format:terraform"]
description = "Format Terraform code"
run = "terraform fmt -recursive"

[tasks."format:frontend:eslint"]
description = "Fix ESLint issues for frontend"
run = "yarn --cwd frontend/api run lint:fix && yarn --cwd frontend/transcription-ui run lint:fix"

[tasks."format:frontend:prettier"]
description = "Fix Prettier issues for frontend"
run = "yarn --cwd frontend/api run format:fix && yarn --cwd frontend/transcription-ui run format:fix"

[tasks."format:frontend"]
description = "Apply all frontend fixes"
depends = ["format:frontend:eslint", "format:frontend:prettier"]

# ---------------------------------------------------------------------------- #
#                              Developer Tasks                                 #
# ---------------------------------------------------------------------------- #

[tasks."generate:protos"]
description = "Generate Python code from Protobuf definitions"
run = "mkdir -p .betterproto_out && uv run --with grpcio-tools python -m grpc_tools.protoc --proto_path=protos --python_out=backend/pipeline/schema_types --grpc_python_out=backend/pipeline/schema_types --pyi_out=backend/pipeline/schema_types protos/*.proto && uv run --with grpcio-tools --with \"betterproto[compiler]>=2.0.0b6\" python -m grpc_tools.protoc --proto_path=protos --python_betterproto_out=.betterproto_out protos/streaming_state.proto && cp .betterproto_out/streaming/pipeline/state/v1/__init__.py backend/pipeline/schema_types/streaming_state.py && rm -rf .betterproto_out"

[tasks."build:common"]
description = "Install, update, and build shared frontend common package"
run = """
echo "Installing and building shared frontend common package..."
yarn --cwd frontend/common install && yarn --cwd frontend/common build
"""

[tasks."install:ui"]
description = "Install and update UI dependencies"
run = """
echo "Installing UI dependencies..."
yarn --cwd frontend/transcription-ui install
"""

[tasks."install:api"]
description = "Install and update API Proxy dependencies"
run = """
echo "Installing API Proxy dependencies..."
yarn --cwd frontend/api install
"""

[tasks."install:env"]
description = "Initialize local env file from example"
run = """
if [ ! -f frontend/transcription-ui/.env.local-dev ]; then
  echo "Initializing .env.local-dev..."
  cp frontend/transcription-ui/.env.local-dev.example frontend/transcription-ui/.env.local-dev
else
  echo -n ".env.local-dev already exists. Overwrite? (Y/N): "
  read -r response
  if [ "$response" = "y" ] || [ "$response" = "Y" ]; then
    echo "Overwriting .env.local-dev..."
    cp frontend/transcription-ui/.env.local-dev.example frontend/transcription-ui/.env.local-dev
  else
    echo "Skipped."
  fi
fi
"""

[tasks."dev:start"]
description = "Start the transcription pipeline in local Docker containers"
depends = ["dev:stop", "build:common", "generate:protos", "install:api", "install:env"]
run = """
docker-compose --env-file local_dev/LOCAL.env up --build -d
"""

[tasks."dev:stop"]
description = "Stop all Docker containers and release host ports"
run = """
docker-compose --env-file local_dev/LOCAL.env down -v --remove-orphans
lsof -t -i :5173 | xargs kill -9 2>/dev/null || true
lsof -t -i :8080 | xargs kill -9 2>/dev/null || true
"""

[tasks."dev:log"]
description = "Run the transcription pipeline in local Docker containers with logs"
depends = ["dev:stop", "build:common", "generate:protos", "install:api", "install:env"]
usage = """
arg "[service]..." help="Services to log from. Default: all"
"""
run = """
docker-compose --env-file local_dev/LOCAL.env logs --tail 100 -t -f {{ arg(name="service") }}
"""

[tasks.dev]
description = "Start the entire system (backend (via Docker) and frontend UI hosted locally)"
depends = ["dev:start", "build:common", "install:ui", "install:env"]
run = "yarn --cwd frontend/transcription-ui run local"

[tasks."dev:add-audio"]
description = "Add a test audio file to the mock audio server for a specific source and feed"
usage = """
arg "<source>" help="The data source (e.g., broadcastify_calls, fire_notifications)"
arg "<feed>" help="The feed ID (e.g., 2912, RECORDINGS/SAN-JOSE-DISP)"
arg "<file>" help="Path to the audio file to add"
"""
run = """
#!/usr/bin/env bash
set -e
DEST_DIR="local_dev/mock_audio/{{ arg(name="source") }}/{{ arg(name="feed") }}"
mkdir -p "$DEST_DIR"
cp "{{ arg(name="file") }}" "$DEST_DIR/"
echo "Added $(basename "{{ arg(name="file") }}") to $DEST_DIR/"
"""

[tasks."dev:whisper:start"]
description = "Start the transcription pipeline with a local ASR model (Whisper) service in Docker"
depends = ["dev:stop"]
run = """
docker-compose --env-file local_dev/LOCAL.env -f docker-compose.yml -f docker-compose.whisper.yml --profile local-whisper up --build -d
"""

[tasks."dev:whisper"]
description = "Start the entire system (transcription pipeline, API services, and frontend UI) with a local ASR model (Whisper)"
depends = ["dev:whisper:start", "build:common", "install:ui", "install:api", "install:env"]
run = "yarn --cwd frontend/transcription-ui run local"

[tasks."dev:remote:init"]
description = "Automatically fetch and configure remote dev environment variables from GCP for running Frontend UI against the dev GCP environment"
run = """
export PROJECT_ID=$(gcloud config get-value project)
gcloud auth application-default login --impersonate-service-account=radio-transcription-api-dev@$PROJECT_ID.iam.gserviceaccount.com
python3 local_dev/setup_remote_dev.py
"""

[tasks."dev:remote:ui"]
description = "Run frontend UI locally and connect to the frontend Proxy API in GCP"
depends = ["dev:stop", "build:common", "install:ui"]
run = """
if [ ! -f frontend/transcription-ui/.env.dev.local ]; then
  echo "No configuration found. Initializing..."
  mise run dev:remote:init
fi

yarn --cwd frontend/transcription-ui dev
"""

[tasks."dev:remote"]
description = "Run frontend proxy API and UI locally, and connect to backend in GCP"
depends = ["dev:stop", "build:common", "install:ui", "install:api"]
env = { VITE_API_BASE_URL = "", VITE_PROXY_API_TARGET = "http://localhost:8080" }
run = """
if [ ! -f frontend/api/.env.local ] || [ ! -f frontend/transcription-ui/.env.dev.local ]; then
  echo "No configuration found. Initializing..."
  mise run dev:remote:init
fi

npx concurrently "yarn --cwd frontend/api local" "yarn --cwd frontend/transcription-ui dev"
"""


# ---------------------------------------------------------------------------- #
#                              Testing Tasks                                   #
# ---------------------------------------------------------------------------- #

[tasks."test:unit"]
description = "Run all unit tests (alias: test)"
alias = ["test"]
depends = ["generate:protos"]
run = "uv run python -m pytest backend/ -q --ignore-glob='**/test_*_integration.py'"

[tasks."test:model"]
description = "Run model/ common-library unit tests (pytest)"
dir = "model"
# Install [scoring] alongside [dev] so the WER/normalizer/bootstrap goldens
# (jiwer + nemo_text_processing) actually run instead of skipping silently.
run = "uv run --extra dev --extra scoring pytest colabs/common/tests/"

[tasks."test:component:rules"]
description = "Run RulesStore component tests"
run = "uv run pytest integration_tests/storage/test_rules_store_integration.py"

[tasks."test:component:feeds"]
description = "Run FeedStore component tests"
run = "uv run pytest integration_tests/storage/test_feed_store_integration.py"

[tasks."test:component:audio_segments"]
description = "Run AudioSegmentStore component tests"
run = "uv run pytest integration_tests/storage/test_audio_segment_store_integration.py"

[tasks."test:component"]
description = "Run all component tests"
run = "uv run pytest integration_tests/storage/"

[tasks."test:e2e"]
description = "Run all E2E tests in Docker Compose"
run = """
docker compose -f docker-compose.yml --env-file local_dev/LOCAL.env down -v --remove-orphans
docker compose -f docker-compose.yml --env-file local_dev/LOCAL.env build integration-tests --with-dependencies
docker compose -f docker-compose.yml --env-file local_dev/LOCAL.env run --rm integration-tests
"""

[tasks."test:api"]
description = "Run API integration tests"
run = "uv run pytest integration_tests/api/"

[tasks."test:e2e:local"]
description = "Run E2E tests on host (Requires running environment)"
depends = ["generate:protos"]
run = "uv run pytest integration_tests/e2e/"