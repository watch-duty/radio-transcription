[settings]
# Automatically use uv virtual environment if available
python.uv_venv_auto = true

[env]
_.file = ".env"

# Set PYTHONPATH to repository root for easier imports
PYTHONPATH = "."

[vars]
backend_dir = "backend"
frontend_dir = "frontend"

# ---------------------------------------------------------------------------- #
#                              Code Quality Tasks                              #
# ---------------------------------------------------------------------------- #

[tasks.lint]
depends = ["lint:ruff", "lint:ty", "lint:terraform", "lint:frontend", "lint:notebooks"]

[tasks."lint:ruff"]
description = "Run ruff Python linter with auto-fix"
run = "uv run ruff format --check"

[tasks."lint:ty"]
description = "Run ty Python type-checker"
run = "uv run ty check"

[tasks."lint:terraform"]
description = "Validate Terraform code and check formatting for pre-submits"
run = """
terraform validate
terraform fmt -check -recursive
"""

[tasks."lint:frontend:eslint"]
description = "Run ESLint checks for frontend"
run = "yarn --cwd frontend/api run lint:check && yarn --cwd frontend/transcription-ui run lint:check"

[tasks."lint:frontend:prettier"]
description = "Run Prettier checks for frontend"
run = "yarn --cwd frontend/api run format:check && yarn --cwd frontend/transcription-ui run format:check"

[tasks."lint:frontend:tsc"]
description = "Run Type checks for frontend"
run = "yarn --cwd frontend/api run typecheck && yarn --cwd frontend/transcription-ui run typecheck"

[tasks."lint:frontend"]
description = "Run all frontend lint checks"
depends = ["lint:frontend:eslint", "lint:frontend:prettier", "lint:frontend:tsc"]

[tasks."lint:notebooks"]
description = "Lint notebooks for schema issues in model/colabs"
run = """
for f in $(find model/colabs -name "*.ipynb"); do
  if ! jq -e '[.cells[] | select((.cell_type == "markdown" and has("execution_count")) or (.cell_type == "code" and (has("outputs") | not)))] | length == 0' "$f" > /dev/null; then
    echo "Invalid notebook schema detected in: $f"
    exit 1
  fi
done
echo "All notebooks have valid schemas."
"""

[tasks.format]
depends = ["format:ruff", "format:terraform", "format:frontend"]

[tasks."format:ruff"]
description = "Format Python code with ruff"
run = "uv run ruff format"

[tasks."format:notebooks"]
description = "Fix schema issues and format notebooks in model/colabs"
run = """
for f in $(find model/colabs -name "*.ipynb"); do
  jq '.cells[] |= (if .cell_type == "markdown" then del(.execution_count) else . end | if .cell_type == "code" and (has("outputs") | not) then .outputs = [] else . end)' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
done
uv run ruff format model/colabs
"""

[tasks."format:terraform"]
description = "Format Terraform code"
run = "terraform fmt -recursive"

[tasks."format:frontend:eslint"]
description = "Fix ESLint issues for frontend"
run = "yarn --cwd frontend/api run lint:fix && yarn --cwd frontend/transcription-ui run lint:fix"

[tasks."format:frontend:prettier"]
description = "Fix Prettier issues for frontend"
run = "yarn --cwd frontend/api run format:fix && yarn --cwd frontend/transcription-ui run format:fix"

[tasks."format:frontend"]
description = "Apply all frontend fixes"
depends = ["format:frontend:eslint", "format:frontend:prettier"]

[tasks."generate:protos"]
description = "Generate Python code from Protobuf definitions"
run = "uv run python -m grpc_tools.protoc --proto_path=protos --python_out=backend/pipeline/schema_types --grpc_python_out=backend/pipeline/schema_types --pyi_out=backend/pipeline/schema_types protos/*.proto"

[tasks."test:unit"]
description = "Run all unit tests"
run = "uv run python -m unittest discover backend/pipeline"

[tasks.test]
description = "Run all unit tests (alias)"
depends = ["test:unit"]

[tasks."test:component:rules"]
description = "Run RulesStore component tests"
run = "uv run pytest integration_tests/storage/test_rules_store_integration.py"

[tasks."test:component:feeds"]
description = "Run FeedStore component tests"
run = "uv run pytest integration_tests/storage/test_feed_store_integration.py"

[tasks."test:component"]
description = "Run all component tests"
run = "uv run pytest integration_tests/storage/"

[tasks."test:e2e"]
description = "Run all E2E tests in Docker Compose"
run = """
docker compose run --rm integration-tests
docker compose down
"""

[tasks."test:api"]
description = "Run API integration tests"
run = "uv run pytest integration_tests/api/"

[tasks."test:e2e:local"]
description = "Run E2E tests on host (Requires running environment)"
depends = ["generate:protos"]
run = "uv run pytest integration_tests/e2e/"