syntax = "proto3";

message ContinuousAudio {
  message Timestamp {
    int64 seconds = 1;
    int32 nanos = 2;
  }

  string gcs_uri = 1;
  Timestamp start_timestamp = 2;
  optional string session_id = 3;
  int32 duration_ms = 4;
  string feed_name = 5;
  string feed_id = 7;
  
  reserved 6, 8;
  reserved "external_id";
}
