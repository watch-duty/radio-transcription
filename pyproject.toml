[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[project]
name = "radio-transcription"
version = "0.0.0"
readme = "README.md"
requires-python = ">=3.13, <3.14"
dependencies = [
    "radio-transcription-common",
    "audio-segments-service",
    "feeds-service",
    "rules-service",
    "normalization-pipeline",
    "segmentation-pipeline",
    "transcription-function",
    "evaluation-function",
    "notification-function",
    # Dependencies for non-packaged directories (ingestion, storage, etc.)
    "uvloop>=0.21.0",
    "curl-cffi>=0.9.1",
    "urllib3>=2.7.0",
    "google-cloud-secret-manager>=2.26.0",
    "pyjwt>=2.13.0",
    "tenacity>=9.1.4",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.2.0",
    "redis>=7.3.0",
    "pydantic-settings>=2.14.2",
]

[tool.uv]
default-groups = ["dev"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[dependency-groups]
build = ["grpcio-tools>=1.65.5"]
dev = [
  "ruff>=0.14.14",
  "ty>=0.0.42",
  "vulture>=2.14.0",
  "grpcio-tools",
  "testcontainers[postgres]",
  "docker",
  "httpx",
  "fakeredis",
  "pytest>=9.0.2",
  "pytest-asyncio>=1.3.0",
  "pytest-cov",
  "pytest-xdist",
  "boto3",
  "pre-commit>=4.5.1",
  "soundfile>=0.12.1",
  "pyopenssl>=26.0.0",
  "deepdiff>=9.1.0",
  "types-protobuf>=7.34.1",
]

[tool.ruff]
target-version = "py313"
extend-exclude = [
  "backend/pipeline/schema_types",
  "**/*_pb2.py",
  "**/*_pb2.pyi",
  "vulture_whitelist.py",
  "vulture_manual_whitelist.py",
]
line-length = 80

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed
  "ARG001",  # Unused function argument
  "ARG002",  # Unused method argument
  "ARG003",  # Unused class method argument
  "ARG004",  # Unused static method argument
  "ARG005",  # Unused lambda argument
  "B007",    # Loop control variable not used within loop body
  "B904",    # Within an `except` clause, raise exceptions with `raise ... from err`
  "BLE001",  # Do not catch blind exception: `Exception`
  "C401",    # Unnecessary generator (rewrite as a set comprehension)
  "C402",    # Unnecessary generator (rewrite as a dict comprehension)
  "C408",    # Unnecessary `dict()` call (rewrite as a literal)
  "C901",    # Function is too complex
  "COM812",  # missing-trailing-comma
  "D100",    # Missing docstring in public module
  "D101",    # Missing docstring in public class
  "D102",    # Missing docstring in public method
  "D103",    # Missing docstring in public function
  "D104",    # Missing docstring in public package
  "D105",    # Missing docstring in magic method
  "D106",    # Missing docstring in public nested class
  "D107",    # Missing docstring in `__init__`
  "D200",    # One-line docstring should fit on one line
  "D203",    # 1 blank line required before class docstring
  "D205",    # 1 blank line required between summary line and description
  "D212",    # Multi-line docstring summary should start at the first line
  "D400",    # First line should end with a period
  "D401",    # First line of docstring should be in imperative mood
  "D415",    # First line should end with a period, question mark, or exclamation point
  "DTZ001",  # `datetime.datetime()` called without a `tzinfo` argument
  "DTZ003",  # `datetime.datetime.utcnow()` used
  "DTZ005",  # `datetime.datetime.now()` called without a `tz` argument
  "DTZ006",  # `datetime.datetime.fromtimestamp()` called without a `tz` argument
  "DTZ007",  # Naive datetime constructed using `datetime.datetime.strptime()` without %z
  "E501",    # Line too long
  "ERA001",  # Found commented-out code
  "FIX002",  # Line contains TODO
  "G001",    # Logging statement uses `str.format`
  "G004",    # Logging statement uses f-string
  "ICN001",  # `xml.etree.ElementTree` should be imported as `ET`
  "N801",    # Class name should use CapWords convention
  "N806",    # Variable in function should be lowercase
  "N813",    # Camelcase imported as lowercase
  "N818",    # Exception name should be named with an Error suffix
  "PERF401", # Use a list comprehension to create a transformed list
  "PGH003",  # Use specific rule codes when ignoring type issues
  "PLC0206", # Extracting value from dictionary without calling `.items()`
  "PLR0913", # Too many arguments in function definition
  "PLR1714", # Consider merging multiple comparisons
  "PLR2004", # Magic value used in comparison
  "PLW1641", # Object does not implement `__hash__` method
  "PT009",   # Use a regular `assert` instead of unittest-style `assertEqual`
  "PT027",   # Use `pytest.raises` instead of unittest-style `assertRaises`
  "PTH118",  # `os.path.join()` should be replaced by `Path` with `/` operator
  "PTH123",  # `open()` should be replaced by `Path.open()`
  "RSE102",  # Unnecessary parentheses on raised exception
  "RUF001",  # String contains ambiguous character
  "RUF003",  # Comment contains ambiguous character
  "RUF005",  # Consider iterable unpacking instead of concatenation
  "RUF012",  # Mutable class attributes should be annotated with `typing.ClassVar`
  "RUF015",  # Prefer `next(...)` over single element slice
  "S106",    # Possible hardcoded password assigned to argument
  "S301",    # `pickle` can be unsafe when used to deserialize untrusted data
  "S303",    # Use of insecure MD2, MD4, MD5, or SHA1 hash function
  "S308",    # Use of `mark_safe` may expose cross-site scripting vulnerabilities
  "S314",    # Using `xml` to parse untrusted data is known to be vulnerable
  "S324",    # Probable use of insecure hash functions in `hashlib`
  "S603",    # `subprocess` call: check for execution of untrusted input
  "S607",    # Starting a process with a partial executable path
  "SIM101",  # Multiple `isinstance` calls, merge into a single call
  "SIM102",  # Use a single `if` statement instead of nested `if` statements
  "SIM103",  # Return the negated condition directly
  "SIM105",  # Use `contextlib.suppress(...)` instead of `try`-`except`-`pass`
  "SIM108",  # Use ternary operator instead of `if`-`else`-block
  "SIM117",  # Use a single `with` statement with multiple contexts
  "SIM118",  # Use `key in dict` instead of `key in dict.keys()`
  "TD002",   # Missing author in TODO
  "TID252",  # Prefer absolute imports over relative imports from parent modules
  "TRY401",  # Redundant exception object included in `logging.exception` call
  "UP007",   # Use `X | Y` for type annotations
  "UP008",   # Use `super()` instead of `super(__class__, self)`
  "UP030",   # Use implicit references for positional format fields
  "W291",    # Trailing whitespace
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.mccabe]
# for reference: Flake8 is 15
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["backend", "local_dev"]

[tool.ruff.lint.per-file-ignores]
"model/colabs/**/*.ipynb" = [
  "ALL",   # Ignore all linting rules for notebooks
]
"model/colabs/**/*.py" = [
  "ALL",   # Ignore all linting rules for python files in colabs
]
"local_dev/**/*.py" = [
  "ANN001",
  "ANN201",
  "PTH110",
  "PTH111",
  "S110",
  "S603",
  "S607",
  "T201",
]
"**/**/test*.py" = [
  "ANN001", # Missing type annotation for function argument
  "ANN002", # Missing type annotation for *args
  "ANN003", # Missing type annotation for **kwargs
  "ANN202", # Missing return type annotation for public method
  "ANN206", # Missing return type annotation for classmethod
  "B017",   # Do not assert blind exception: `Exception`
  "C405",   # Unnecessary list literal (rewrite as a set literal)
  "DTZ002", # `datetime.datetime.today()` used
  "DTZ006", # `datetime.datetime.fromtimestamp()` called without a `tz` argument
  "N802",   # Function name should be lowercase
  "N806",   # Variable in function should be lowercase
  "N815",   # Variable in class scope should not be mixedCase
  "PT018",  # Break assertions into separate statements
  "PT019",  # Fixture without value is injected as parameter
  "PT028",  # Test function parameter has default argument
  "RET503", # Missing explicit `return` at the end of function
  "S101",   # Use of assert detected
  "S105",   # Possible hardcoded password assigned
  "S113",   # requests.* require timeout=
  "S608",   # Possible SQL injection via string-based query construction
  "SLF001", # Private member accessed
]
"model/data_sources/**.py" = [
  "ANN001", # Missing type annotation for function argument
  "ANN201", # Missing return type annotation
  "B017",   # Do not assert blind exception: `Exception`
  "C405",   # Unnecessary list literal (rewrite as a set literal)
  "DTZ002", # `datetime.datetime.today()` used
  "DTZ006", # `datetime.datetime.fromtimestamp()` called without a `tz` argument
  "INP001", # Implicit namespaces
  "N802",   # Function name should be lowercase
  "N806",   # Variable in function should be lowercase
  "RET503", # Missing explicit `return` at the end of function
  "S105",   # Possible hardcoded password assigned
  "S110",   # Allow swallowing exceptions
  "S113",   # requests.* require timeout=
  "T201",   # `print()` found
]
".github/scripts/**.py" = [
  "INP001", # Implicit namespaces (no __init__.py needed for standalone scripts)
]

[tool.ruff.lint.pydocstyle]
convention = "google"


[tool.ty.src]
exclude = ["model/", "backend/services/local-whisper-api/", "scratch/", "vulture_whitelist.py", "vulture_manual_whitelist.py"]

[tool.pyright]
pythonVersion = "3.13"
reportUnusedTypeIgnoreComment = false

[tool.uv.workspace]
members = [
    "backend/pipeline/common",
    "backend/pipeline/normalization",
    "backend/pipeline/segmentation",
    "backend/pipeline/transcription",
    "backend/pipeline/evaluation",
    "backend/pipeline/notification",
    "backend/services/audio_segments",
    "backend/services/feeds",
    "backend/services/rules",
]

[tool.uv.sources]
radio-transcription-common = { workspace = true }
audio-segments-service = { workspace = true }
feeds-service = { workspace = true }
rules-service = { workspace = true }
normalization-pipeline = { workspace = true }
segmentation-pipeline = { workspace = true }
transcription-function = { workspace = true }
evaluation-function = { workspace = true }
notification-function = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-n auto"
filterwarnings = [
    "ignore:cannot collect test class 'TestStream':pytest.PytestCollectionWarning",
    "ignore:Cannot monitor channel state:pytest.PytestUnhandledThreadExceptionWarning",
]

[tool.coverage.run]
omit = [
    "**/*test*",
    "**/tests/**",
    "**/conftest.py",
]

[tool.vulture]
exclude = [
    ".venv",
    "backend/pipeline/schema_types",
    "backend/services/local-whisper-api",
    "**/tests/**",
    "**/test_*.py",
    "**/conftest.py",
]
paths = ["backend", "vulture_whitelist.py", "vulture_manual_whitelist.py"]
min_confidence = 60

