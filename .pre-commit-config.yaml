# Install both hook types: pre-commit install -t pre-commit -t pre-push
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: generate-protos
        name: generate protobufs
        entry: mise run generate:protos
        language: system
        files: ^protos/.*\.proto$
        pass_filenames: false
      - id: validate-schemas
        name: validate pubsub schemas
        entry: mise run lint:schemas
        language: system
        files: ^protos/.*\.proto$
        pass_filenames: false
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ty-check
        name: ty type checker
        entry: uv run ty check
        language: system
        types_or: [python, pyi]
        require_serial: true
        pass_filenames: false
      - id: lint-notebooks
        name: lint notebooks
        entry: mise run lint:notebooks
        language: system
        files: ^model/colabs/.*\.ipynb$
        pass_filenames: false
      - id: proxy-eslint
        name: Run ESLint
        entry: yarn --cwd frontend/api lint:check
        language: system
        files: ^frontend/api/
        pass_filenames: false
      - id: proxy-prettier
        name: Run Prettier
        entry: yarn --cwd frontend/api format:check
        language: system
        files: ^frontend/api/
        pass_filenames: false
      - id: proxy-generate-routes
        name: Generate routes
        entry: yarn --cwd frontend/api generate-routes
        language: system
        files: ^frontend/api/
        pass_filenames: false
      - id: proxy-type-check
        name: Type check
        entry: yarn --cwd frontend/api run tsc --noEmit
        language: system
        files: ^frontend/api/
        pass_filenames: false
      - id: verify-openapi-spec
        name: Verify OpenAPI Spec
        entry: yarn --cwd frontend/api verify-spec
        language: system
        files: ^frontend/api/
        pass_filenames: false
      - id: ui-eslint
        name: Run ESLint
        entry: yarn --cwd frontend/transcription-ui lint:check
        language: system
        files: ^frontend/transcription-ui/
        pass_filenames: false
      - id: ui-prettier
        name: Run Prettier
        entry: yarn --cwd frontend/transcription-ui format:check
        language: system
        files: ^frontend/transcription-ui/
        pass_filenames: false
      - id: ui-type-check
        name: Type check
        entry: yarn --cwd frontend/transcription-ui run tsc --noEmit
        language: system
        files: ^frontend/transcription-ui/
        pass_filenames: false
      # pre-push stage: heavier suites, each scoped by path so a push only runs
      # the suites for the areas it touches (`common` triggers both frontends).
      - id: push-lint-python
        name: lint:python (full)
        entry: mise run lint:python
        language: system
        pass_filenames: false
        files: \.(py|pyi|ipynb)$
        stages: [pre-push]
      - id: push-backend-tests
        name: backend unit tests
        entry: mise run test:unit
        language: system
        pass_filenames: false
        files: ^(backend|protos)/
        stages: [pre-push]
      - id: push-api-build
        name: frontend/api build
        entry: yarn --cwd frontend/api build
        language: system
        pass_filenames: false
        files: ^frontend/(api|common)/
        stages: [pre-push]
      - id: push-verify-openapi-spec
        name: Verify OpenAPI Spec
        entry: yarn --cwd frontend/api verify-spec
        language: system
        pass_filenames: false
        files: ^frontend/(api|common)/
        stages: [pre-push]
      - id: push-ui-build
        name: frontend/transcription-ui build:dev
        entry: yarn --cwd frontend/transcription-ui build:dev
        language: system
        pass_filenames: false
        files: ^frontend/(transcription-ui|common)/
        stages: [pre-push]
      - id: push-api-tests
        name: frontend/api tests
        entry: yarn --cwd frontend/api test --watch=false
        language: system
        pass_filenames: false
        files: ^frontend/(api|common)/
        stages: [pre-push]
      - id: push-ui-tests
        name: frontend/transcription-ui tests
        entry: yarn --cwd frontend/transcription-ui test --watch=false
        language: system
        pass_filenames: false
        files: ^frontend/(transcription-ui|common)/
        stages: [pre-push]
