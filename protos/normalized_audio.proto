syntax = "proto3";
import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

// Represents a normalized audio transmission that is ready to be transcribed by the Speech API.
// TODO(watch-duty): Once the pipeline fully migrates to tracking transmissions via database
// segment IDs, many fields below (such as source_audio_uris and feed_name)
// can be deprecated and removed from this schema since they can be resolved directly from
// the database via the segment ID!
message NormalizedAudio {

  reserved 1;
  reserved "transmission_id";

  // The unique identifier of the radio feed this segment originated from (formatted as a RFC 4122 UUID).
  string feed_id = 2;

  // A unique, deterministic identifier for this specific audio segment (formatted as a RFC 4122 UUID).
  string segment_id = 15;


  // --- Global Timing & Context Flags ---
  
  // The exact global timestamp when this transmission started.
  google.protobuf.Timestamp start_timestamp = 3;

  // The exact global timestamp when this transmission ended.
  google.protobuf.Timestamp end_timestamp = 4;

  // Indicates this transmission lacks prior context (e.g., cut off abruptly mid-speech).
  bool missing_prior_context = 5;

  // Indicates this transmission lacks subsequent context (e.g., transmission duration exceeded).
  bool missing_post_context = 6;


  // --- Physical Audio Storage Details ---

  // Ordered list of GCS URIs for the raw audio files used to assemble this transmission.
  repeated string source_audio_uris = 7;

  // The exact slice offset within the *first* URI in source_audio_uris where the transcribed speech formally begins.
  google.protobuf.Duration start_audio_offset = 8;

  // The exact slice offset within the *last* URI in source_audio_uris where the transcribed speech formally ends.
  google.protobuf.Duration end_audio_offset = 9;

  // The final unified canonical reference audio file URI for this transmission.
  string canonical_audio_uri = 10;

  // The URI of the audio file optimized for playback (e.g., compressed M4A/Opus).
  string playback_audio_uri = 11;

  // The human-readable name of the radio feed as stored in the database.
  string feed_name = 12;

  reserved 13;
  reserved "external_id";

  enum AudioClassification {
    AUDIO_CLASSIFICATION_UNSPECIFIED = 0;
    AUDIO_CLASSIFICATION_SPEECH = 1;
    AUDIO_CLASSIFICATION_OTHER = 2;
  }

  // The classification of the audio segment (speech vs. non-speech).
  AudioClassification audio_classification = 14;

  // The URI of the mono downmixed FLAC file optimized specifically for ephemeral ASR transcription inference.
  optional string transcription_audio_uri = 16;

  // The exact UTC timestamp when this chunk was first ingested into the system.
  google.protobuf.Timestamp ingested_at = 17;
}

