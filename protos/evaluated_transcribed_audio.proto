syntax = "proto3";
import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

// Identifiers, timestamps, transcript, and evaluation decisions for transcribed audio.
message EvaluatedTranscribedAudio {

  // A span of text within the transcript that matched a rule.
  message TextMatchSpan {
    // Codepoint offset (inclusive) of the first character of the match.
    int32 start = 1;

    // Codepoint offset (exclusive) of the character after the last character of the match.
    int32 end = 2;

    // The matched substring, preserved with its original casing.
    string matched_text = 3;
  }

  // Annotation kind for keyword/regex rules: one or more spans of matched text.
  message TextMatchAnnotation {
    repeated TextMatchSpan spans = 1;
  }

  // A single triggered rule's annotation. The rule_id lives in the
  // rule_annotations map key, not here. The `annotation` oneof carries a payload
  // specific to the rule kind (e.g. text spans for keyword/regex rules, future
  // kinds for burst/audio/metadata rules).
  message RuleAnnotation {
    oneof annotation {
      TextMatchAnnotation text_match = 1;
    }
  }

  // --- Identifiers ---
  // The unique identifier of the radio feed this transmission originated from (formatted as a RFC 4122 UUID).
  string feed_id = 1;

  reserved 2;
  reserved "transmission_id";

  // A unique, deterministic identifier for this specific segment (formatted as a RFC 4122 UUID).
  string segment_id = 18;


  // --- Content ---
  // The full transcript text evaluated from the audio transmission.
  string transcript = 3;


  // --- Timestamps ---
  // The exact global timestamp when this transmission started.
  google.protobuf.Timestamp start_timestamp = 4;

  // The exact global timestamp when this transmission ended.
  google.protobuf.Timestamp end_timestamp = 5;


  // --- Quality & Context Flags ---
  // Indicates this transmission lacks prior context (e.g., cut off abruptly mid-speech).
  bool missing_prior_context = 6;

  // Indicates this transmission lacks subsequent context (e.g., transmission duration exceeded).
  bool missing_post_context = 7;

  // --- Physical Audio Tracking ---
  // Ordered list of GCS URIs for the raw audio files used to assemble this transmission.
  repeated string source_audio_uris = 8;

  // The exact slice offset within the *first* URI where the transcribed speech formally begins.
  google.protobuf.Duration start_audio_offset = 9;

  // The exact slice offset within the *last* URI where the transcribed speech formally ends.
  google.protobuf.Duration end_audio_offset = 10;

  // The final unified canonical reference audio file URI for this transmission.
  string canonical_audio_uri = 11;

  // The URI of the audio file optimized for playback (e.g., compressed M4A/Opus).
  string playback_audio_uri = 12; 

  // --- Decisions ---
  // The list of rule IDs triggered by this transcript during evaluation.
  repeated string evaluation_decisions = 13;

  // The list of errors encountered during evaluation.
  repeated string errors = 17;

  // The human-readable name of the radio feed as stored in the database.
  string feed_name = 15;

  // Per-rule annotations describing how each triggered rule matched, keyed by
  // rule_id. This is an unordered sidecar: evaluation_decisions is the ordered
  // source of truth for which rules fired; rule_annotations only carries the
  // optional payload for rules that produced one. Text-match rules carry span
  // offsets; future non-text rule kinds carry their own annotation messages via
  // the oneof in RuleAnnotation.
  map<string, RuleAnnotation> rule_annotations = 19;

  // Reserved old enum field for backward compatibility in Pub/Sub schemas.
  // Field 16 (external_id) removed in GOO-498.
  reserved 14, 16;
  reserved "external_id";
}
